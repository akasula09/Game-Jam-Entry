<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Inevitable</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Eye Drooping Effect */
        #lid-top, #lid-bottom {
            position: absolute;
            width: 100%;
            height: 50%;
            background: #000;
            z-index: 100;
            transition: height 1.5s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        #lid-top { top: 0; }
        #lid-bottom { bottom: 0; }

        /* UI Overlays */
        .overlay {
            position: absolute;
            pointer-events: none;
            display: none;
            z-index: 50;
        }

        #crosshair {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 20px;
            display: block;
        }

        #interact-prompt {
            top: 55%;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 0px #000;
        }

        #flash-text {
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 40px;
            text-shadow: 3px 3px 0px #000;
            opacity: 0;
            transition: opacity 0.5s;
            display: block;
        }

        #hint-text {
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            font-size: 18px;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 5px;
            opacity: 0;
            transition: opacity 1s;
            display: block;
        }

        #note-view {
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 60;
            pointer-events: auto;
        }

        #note-view .paper {
            background: #f4f4f4;
            padding: 60px;
            border-radius: 2px;
            box-shadow: 0 0 20px rgba(0,0,0,1);
            max-width: 600px;
            text-align: center;
        }

        #note-view p {
            color: #900;
            font-size: 35px;
            font-weight: bold;
            font-style: italic;
            margin: 0;
            font-family: 'Times New Roman', Times, serif;
        }

        #note-view .sub {
            color: #ccc;
            margin-top: 30px;
            font-size: 16px;
        }

        #dialog-box {
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 700px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #555;
            color: white;
            padding: 20px;
            font-size: 20px;
            line-height: 1.5;
            display: none;
            z-index: 60;
        }

        #dialog-box .advance {
            display: block;
            margin-top: 15px;
            color: #888;
            font-size: 14px;
            text-align: right;
        }

        #input-view {
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 30px;
            border: 2px solid #fff;
            display: none;
            z-index: 70;
            pointer-events: auto;
            text-align: center;
        }
        #input-view input {
            width: 300px; padding: 10px; font-size: 18px; background: #222; color: #fff; border: 1px solid #555; outline: none;
        }
        #input-view button {
            padding: 10px 20px; font-size: 18px; margin-left: 10px; cursor: pointer; background: #444; color: #fff; border: 1px solid #777;
        }
        #input-view button:hover { background: #666; }

        /* Game Over */
        #game-over {
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            pointer-events: auto;
        }
        #game-over h1 {
            color: #d00;
            font-size: 3vw;
            text-shadow: 0 0 10px #f00;
            text-align: center;
            margin-bottom: 30px;
        }
        #level2-btn {
            padding: 15px 35px;
            font-size: 22px;
            font-family: 'Courier New', Courier, monospace;
            background: #111;
            color: #ff0000;
            border: 2px solid #880000;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
            transition: all 0.3s ease;
        }
        #level2-btn:hover {
            background: #880000;
            color: #fff;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.9);
        }

        .click-to-start {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: #000; color: white; display: flex; align-items: center; justify-content: center;
            z-index: 200; font-size: 24px; cursor: pointer;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="start-screen" class="click-to-start">Click to Wake Up</div>

    <div id="lid-top"></div>
    <div id="lid-bottom"></div>

    <div id="crosshair" class="overlay">+</div>
    <div id="interact-prompt" class="overlay"></div>
    <div id="flash-text" class="overlay">The house is locked.</div>
    <div id="hint-text" class="overlay"></div>

    <div id="note-view" class="overlay">
        <div class="paper">
            <p id="note-text">They're coming...</p>
        </div>
        <div class="sub">Press Z to put down</div>
    </div>

    <div id="dialog-box" class="overlay">
        <span id="dialog-text"></span>
        <span class="advance">[ Z ] to advance</span>
    </div>

    <div id="input-view" class="overlay">
        <p style="color:white; margin-top:0;">Ask the entity a question:</p>
        <input type="text" id="q-input" autocomplete="off" placeholder="What are you?" />
        <button id="q-btn">Ask</button>
    </div>

    <div id="game-over" class="overlay">
        <h1>GAME OVER.<br><br>YOU CANT ESCAPE HIM.<br><br>IT IS INEVITABLE.</h1>
        <button id="level2-btn">Awake in the Desert</button>
    </div>

<script>
// --- GAME STATE ENUM ---
const STATE = {
    WAKING: 0,
    FIND_KEY: 1,
    ENTER_HOUSE: 2,
    NOTE1_READ: 3,
    FIND_NOTE2: 4,
    NOTE2_READ: 5,
    SEEK_BOX: 6,
    FIND_CROWBAR: 7,
    BREAK_BOX: 8,
    HUNT_SMILER: 9,
    SMILER_TALK1: 10,
    SMILER_TALK2: 11,
    INPUT_Q: 12,
    WAIT_Q: 13,
    READ_A: 14,
    SMILER_COUNTING: 15,
    CHASE: 16,
    DEAD: 17
};

let currentState = STATE.WAKING;
let timeInState = 0;
let hasKey = false;
let hasCrowbar = false;

// Inventory & State variables
let hasAxe = false;
let hasWood = false;
let hasMirror = false;
let isDoorBarricaded = false;
let trapdoorOpen = false;
let smilerCountdown = 15;
let smilerAttackTime = 0;
let doorFallen = false;
let barrierFallen = false;
let isClimbingLadder = false;

// Physics / Jump state
let verticalVelocity = 0;
let isGrounded = true;

// --- CONFIG & DOM ---
const ui = {
    start: document.getElementById('start-screen'),
    prompt: document.getElementById('interact-prompt'),
    flash: document.getElementById('flash-text'),
    hint: document.getElementById('hint-text'),
    note: document.getElementById('note-view'),
    noteTxt: document.getElementById('note-text'),
    dialog: document.getElementById('dialog-box'),
    dialogTxt: document.getElementById('dialog-text'),
    inputView: document.getElementById('input-view'),
    inputField: document.getElementById('q-input'),
    inputBtn: document.getElementById('q-btn'),
    gameOver: document.getElementById('game-over'),
    lvl2Btn: document.getElementById('level2-btn'),
    lidTop: document.getElementById('lid-top'),
    lidBottom: document.getElementById('lid-bottom')
};

ui.lvl2Btn.addEventListener('click', () => {
    window.location.href = '/leveltwo';
});

// --- THREE.JS SETUP ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020202);
scene.fog = new THREE.Fog(0x020202, 2, 35);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0x223344, 0.6);
scene.add(ambientLight);
const moonLight = new THREE.DirectionalLight(0x6688aa, 0.5);
moonLight.position.set(10, 20, 10);
scene.add(moonLight);

const houseLight = new THREE.PointLight(0xffa500, 0.8, 15);
houseLight.position.set(0, 2, -15);
scene.add(houseLight);

const basementLight = new THREE.PointLight(0xff6600, 0.8, 12);
basementLight.position.set(0, -2.5, -15);
scene.add(basementLight);

// Floating Arrow Guidance Mesh
const arrowGeo = new THREE.ConeGeometry(0.4, 1.2, 8);
arrowGeo.rotateX(Math.PI);
const arrowMat = new THREE.MeshBasicMaterial({ color: 0xff3333, wireframe: true });
const guideArrow = new THREE.Mesh(arrowGeo, arrowMat);
guideArrow.visible = false;
scene.add(guideArrow);

// --- CONTROLS & MOVEMENT ---
let pitch = 0;
let yaw = 0;
const PI_2 = Math.PI / 2;
const keys = { w: false, a: false, s: false, d: false, z: false, space: false };
const direction = new THREE.Vector3();
let speed = 6.0;
let smilerSpeed = 2.0;

document.addEventListener('mousemove', (e) => {
    if (document.pointerLockElement === document.body && currentState !== STATE.DEAD) {
        yaw -= e.movementX * 0.002;
        pitch -= e.movementY * 0.002;
        pitch = Math.max(-PI_2 + 0.2, Math.min(PI_2 - 0.2, pitch));
        
        const qx = new THREE.Quaternion();
        qx.setFromAxisAngle(new THREE.Vector3(1, 0, 0), pitch);
        const qy = new THREE.Quaternion();
        qy.setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        camera.quaternion.copy(qy).multiply(qx);
    }
});

document.addEventListener('keydown', (e) => {
    if(e.code === 'KeyW') keys.w = true;
    if(e.code === 'KeyA') keys.a = true;
    if(e.code === 'KeyS') keys.s = true;
    if(e.code === 'KeyD') keys.d = true;
    if(e.code === 'Space') {
        if(isGrounded && currentState !== STATE.DEAD) {
            verticalVelocity = 5.0; // Jump impulse
            isGrounded = false;
        }
        keys.space = true;
    }
    if(e.code === 'KeyZ') {
        if (!keys.z) handleZPress();
        keys.z = true;
    }
});
document.addEventListener('keyup', (e) => {
    if(e.code === 'KeyW') keys.w = false;
    if(e.code === 'KeyA') keys.a = false;
    if(e.code === 'KeyS') keys.s = false;
    if(e.code === 'KeyD') keys.d = false;
    if(e.code === 'Space') keys.space = false;
    if(e.code === 'KeyZ') keys.z = false;
});

ui.start.addEventListener('click', () => {
    ui.start.style.display = 'none';
    document.body.requestPointerLock();
    startWakingSequence();
});
document.body.addEventListener('click', () => {
    if (ui.start.style.display === 'none' && 
        currentState !== STATE.DEAD && 
        currentState !== STATE.INPUT_Q) {
        document.body.requestPointerLock();
    }
});

// --- WORLD BUILDING ---
const interactables = [];
let solidWalls = [];
let treeMeshes = [];

function addWallCollider(x, z, w, d) {
    solidWalls.push({
        minX: x - w/2, maxX: x + w/2,
        minZ: z - d/2, maxZ: z + d/2
    });
}

// Flat Ground Level
const groundMat = new THREE.MeshLambertMaterial({ color: 0x112211 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, 0, 0);
scene.add(ground);

// House Floor (Thin flat overlay with cutout hole for trapdoor at x:-2..0, z:-16..-14)
const woodFloorMat = new THREE.MeshLambertMaterial({ color: 0x3d2817 });
function makeFloorTile(x, z, w, d) {
    let f = new THREE.Mesh(new THREE.PlaneGeometry(w, d), woodFloorMat);
    f.rotation.x = -Math.PI / 2;
    f.position.set(x, 0.001, z);
    scene.add(f);
}
makeFloorTile(-3.25, -15, 2.5, 9);  // Left
makeFloorTile(2.25, -15, 4.5, 9);   // Right
makeFloorTile(-1, -17.75, 2, 3.5);  // Back
makeFloorTile(-1, -12.25, 2, 3.5);  // Front

// Basement Ceiling / House Floor Slab (Solid bottom side visible from basement looking up)
const bCeilingMat = new THREE.MeshLambertMaterial({ color: 0x22150a, side: THREE.DoubleSide });
function makeCeilingTile(x, z, w, d) {
    let c = new THREE.Mesh(new THREE.PlaneGeometry(w, d), bCeilingMat);
    c.rotation.x = Math.PI / 2;
    c.position.set(x, -0.01, z);
    scene.add(c);
}
makeCeilingTile(-3.25, -15, 2.5, 9);  // Left ceiling
makeCeilingTile(2.25, -15, 4.5, 9);   // Right ceiling
makeCeilingTile(-1, -17.75, 2, 3.5);  // Back ceiling
makeCeilingTile(-1, -12.25, 2, 3.5);  // Front ceiling

// Forest Trees
const trunkGeo = new THREE.CylinderGeometry(0.3, 0.4, 3);
const trunkMat = new THREE.MeshLambertMaterial({ color: 0x3d2817 });
const leavesGeo = new THREE.ConeGeometry(1.5, 4);
const leavesMat = new THREE.MeshLambertMaterial({ color: 0x0f2a10 });

for (let i = 0; i < 150; i++) {
    let tx = (Math.random() - 0.5) * 80;
    let tz = (Math.random() - 0.5) * 80;
    if (Math.abs(tx) < 6 && tz > -25 && tz < 5) continue;
    if (tx > 6 && tx < 15 && tz > -12 && tz < -4) continue;
    
    let treeGroup = new THREE.Group();
    let trunk = new THREE.Mesh(trunkGeo, trunkMat);
    trunk.position.set(0, 1.5, 0);
    let leaves = new THREE.Mesh(leavesGeo, leavesMat);
    leaves.position.set(0, 4.5, 0);
    treeGroup.add(trunk);
    treeGroup.add(leaves);
    treeGroup.position.set(tx, 0, tz);
    treeGroup.userData = { type: 'tree' };
    scene.add(treeGroup);
    
    treeMeshes.push(treeGroup);
    interactables.push(trunk); 
    trunk.userData = { type: 'tree', parentGroup: treeGroup };
    addWallCollider(tx, tz, 0.8, 0.8);
}

// Key & Key Post
const postGeo = new THREE.CylinderGeometry(0.1, 0.1, 1.5);
const postMesh = new THREE.Mesh(postGeo, trunkMat);
postMesh.position.set(-18, 0.75, -5);
scene.add(postMesh);

const keyGeo = new THREE.TorusGeometry(0.15, 0.04, 8, 16);
const keyMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
const keyMesh = new THREE.Mesh(keyGeo, keyMat);
keyMesh.position.set(-18, 1.3, -4.8);
keyMesh.userData = { type: 'key' };
scene.add(keyMesh);
interactables.push(keyMesh);

// House Walls
const houseMat = new THREE.MeshLambertMaterial({ color: 0x444444 });
const hwBack = new THREE.Mesh(new THREE.BoxGeometry(10, 4, 0.5), houseMat);
hwBack.position.set(0, 2, -20);
scene.add(hwBack); addWallCollider(0, -20, 10, 0.5);

const hwLeft = new THREE.Mesh(new THREE.BoxGeometry(0.5, 4, 10), houseMat);
hwLeft.position.set(-4.75, 2, -15);
scene.add(hwLeft); addWallCollider(-4.75, -15, 0.5, 10);

const hwRight = new THREE.Mesh(new THREE.BoxGeometry(0.5, 4, 10), houseMat);
hwRight.position.set(4.75, 2, -15);
scene.add(hwRight); addWallCollider(4.75, -15, 0.5, 10);

const hwF1 = new THREE.Mesh(new THREE.BoxGeometry(3.5, 4, 0.5), houseMat);
hwF1.position.set(-3, 2, -10);
scene.add(hwF1); addWallCollider(-3, -10, 3.5, 0.5);

const hwF2 = new THREE.Mesh(new THREE.BoxGeometry(3.5, 4, 0.5), houseMat);
hwF2.position.set(3, 2, -10);
scene.add(hwF2); addWallCollider(3, -10, 3.5, 0.5);

const roofGeo = new THREE.ConeGeometry(8, 3, 4);
const roofMat = new THREE.MeshLambertMaterial({ color: 0x221111 });
const roof = new THREE.Mesh(roofGeo, roofMat);
roof.position.set(0, 5.5, -15);
roof.rotation.y = Math.PI/4;
scene.add(roof);

// Door Setup
const doorPivot = new THREE.Group();
doorPivot.position.set(-1.25, 0, -10);
const doorGeo = new THREE.BoxGeometry(2.5, 3.8, 0.2);
const doorMesh = new THREE.Mesh(doorGeo, new THREE.MeshLambertMaterial({ color: 0x5c4033 }));
doorMesh.position.set(1.25, 1.9, 0);
doorPivot.add(doorMesh);
scene.add(doorPivot);
let doorOpen = false;
let doorMoving = false;
doorMesh.userData = { type: 'door' };
interactables.push(doorMesh);
let doorColliderIdx = solidWalls.length;
addWallCollider(0, -10, 2.5, 0.5); 

// Wooden Barricade Mesh
const barricadeGroup = new THREE.Group();
for(let i=0; i<4; i++) {
    let plank = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.3, 0.15), trunkMat);
    plank.position.set(0, 0.8 + i*0.7, -9.85);
    plank.rotation.z = (Math.random() - 0.5) * 0.2;
    barricadeGroup.add(plank);
}
barricadeGroup.visible = false;
scene.add(barricadeGroup);

// Furniture (Bed at x:-3.5, y:0.5, z:-12)
const bed = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 4), new THREE.MeshLambertMaterial({ color: 0x223355 }));
bed.position.set(-3.5, 0.5, -12);
scene.add(bed); addWallCollider(-3.5, -12, 2, 4);

const table = new THREE.Mesh(new THREE.BoxGeometry(2, 1.2, 2), new THREE.MeshLambertMaterial({color: 0x553311}));
table.position.set(2.5, 0.6, -18);
scene.add(table); addWallCollider(2.5, -18, 2, 2);

// TRAPDOOR SYSTEM (Pivot on edge z = -14; Pure swing rotation)
const trapPivot = new THREE.Group();
trapPivot.position.set(-1, 0, -14);
const trapMesh = new THREE.Mesh(new THREE.BoxGeometry(2, 0.05, 2), new THREE.MeshLambertMaterial({ color: 0x3a2510 }));
trapMesh.position.set(0, 0, -1);
trapPivot.add(trapMesh);
scene.add(trapPivot);
trapMesh.userData = { type: 'trapdoor' };
interactables.push(trapMesh);

// Basement Enclosure (-4m deep)
const basementMat = new THREE.MeshLambertMaterial({ color: 0x1f1a14 });
const bFloor = new THREE.Mesh(new THREE.PlaneGeometry(9.5, 9.5), basementMat);
bFloor.rotation.x = -Math.PI / 2;
bFloor.position.set(0, -4.0, -15);
scene.add(bFloor);

const bWallB = new THREE.Mesh(new THREE.BoxGeometry(9.5, 4, 0.4), basementMat); bWallB.position.set(0, -2, -19.5); scene.add(bWallB);
const bWallF = new THREE.Mesh(new THREE.BoxGeometry(9.5, 4, 0.4), basementMat); bWallF.position.set(0, -2, -10.5); scene.add(bWallF);
const bWallL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 4, 9.5), basementMat); bWallL.position.set(-4.5, -2, -15); scene.add(bWallL);
const bWallR = new THREE.Mesh(new THREE.BoxGeometry(0.4, 4, 9.5), basementMat); bWallR.position.set(4.5, -2, -15); scene.add(bWallR);

// Ladder & Solid Support Wall Behind Ladder
const ladderSupportWall = new THREE.Mesh(new THREE.BoxGeometry(1.6, 4, 0.3), basementMat);
ladderSupportWall.position.set(-1.0, -2.0, -13.85);
scene.add(ladderSupportWall);
addWallCollider(-1.0, -13.85, 1.6, 0.3); // Solid wall collider prevents clipping behind ladder

const ladderMat = new THREE.MeshLambertMaterial({ color: 0x553311 });
const ladderGroup = new THREE.Group();
for(let y=0; y<8; y++) {
    let rung = new THREE.Mesh(new THREE.BoxGeometry(1, 0.08, 0.08), ladderMat);
    rung.position.set(-1.0, -3.8 + y*0.5, -14.1);
    ladderGroup.add(rung);
    rung.userData = { type: 'ladder' };
    interactables.push(rung);
}
scene.add(ladderGroup);

// Basement Tables & Items
const bTable1 = new THREE.Mesh(new THREE.BoxGeometry(2, 1.2, 1.5), ladderMat);
bTable1.position.set(-3.2, -3.4, -15);
scene.add(bTable1);

const axeGroup = new THREE.Group();
const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.2), trunkMat);
handle.rotation.z = Math.PI / 2;
const head = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.4, 0.08), new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8 }));
head.position.set(0.5, 0, 0);
axeGroup.add(handle); axeGroup.add(head);
axeGroup.position.set(-3.2, -2.7, -15);
axeGroup.userData = { type: 'axe' };
scene.add(axeGroup);
interactables.push(head);
head.userData = { type: 'axe' };

const bTable2 = new THREE.Mesh(new THREE.BoxGeometry(2, 1.2, 1.5), ladderMat);
bTable2.position.set(3.2, -3.4, -15);
scene.add(bTable2);

const note3 = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.5), new THREE.MeshBasicMaterial({ color: 0xffffff }));
note3.rotation.x = -Math.PI / 2;
note3.position.set(3.0, -2.79, -15);
note3.userData = { type: 'note3' };
scene.add(note3);
interactables.push(note3);

const mirrorGroup = new THREE.Group();
const mHandle = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.5), ladderMat);
const mFrame = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.04, 16), new THREE.MeshStandardMaterial({ color: 0xaa8833 }));
mFrame.position.set(0, 0.35, 0);
const mGlass = new THREE.Mesh(new THREE.CircleGeometry(0.2, 16), new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9, roughness: 0.1 }));
mGlass.rotation.x = -Math.PI / 2;
mGlass.position.set(0, 0.38, 0);
mirrorGroup.add(mHandle); mirrorGroup.add(mFrame); mirrorGroup.add(mGlass);
mirrorGroup.position.set(3.5, -2.78, -15);
mirrorGroup.userData = { type: 'mirror' };
scene.add(mirrorGroup);
interactables.push(mGlass);
mGlass.userData = { type: 'mirror' };

// Notes (Two Halves)
const note1 = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.5), new THREE.MeshBasicMaterial({ color: 0xffffff }));
note1.rotation.x = -Math.PI / 2;
note1.position.set(2.5, 1.21, -18);
note1.userData = { type: 'note1' };
scene.add(note1);
interactables.push(note1);

// Note 2 placed directly on top of the bed at its new position
const note2 = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.5), new THREE.MeshBasicMaterial({ color: 0xffffff }));
note2.rotation.x = -Math.PI / 2;
note2.position.set(-3.5, 1.01, -12);
note2.userData = { type: 'note2' };
scene.add(note2);

// Crowbar behind the house
const crowbarGeo = new THREE.CylinderGeometry(0.03, 0.03, 1.2);
const crowbarMat = new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.8 });
const crowbarMesh = new THREE.Mesh(crowbarGeo, crowbarMat);

// Box outside
const boxGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
const boxMat = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });
const mysteryBox = new THREE.Mesh(boxGeo, boxMat);
mysteryBox.position.set(10, 0.75, -8);

addWallCollider(10, -8, 1.5, 1.5);

// Smiler Generation
function createFaceTexture(scary) {
    const cvs = document.createElement('canvas');
    cvs.width = 512; cvs.height = 512;
    const ctx = cvs.getContext('2d');
    ctx.fillStyle = scary ? '#880000' : '#ffdd00';
    ctx.fillRect(0,0,512,512);
    
    if(!scary) {
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(160, 200, 30, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(352, 200, 30, 0, Math.PI*2); ctx.fill();
        ctx.lineWidth = 15; ctx.strokeStyle = '#000';
        ctx.beginPath(); ctx.arc(256, 270, 100, 0.2, Math.PI-0.2, false); ctx.stroke();
    } else {
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(160, 200, 40, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(352, 200, 40, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(160, 200, 10, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(352, 200, 10, 0, Math.PI*2); ctx.fill();
        
        ctx.lineWidth = 20; ctx.strokeStyle = '#000';
        ctx.beginPath(); ctx.moveTo(100, 350); ctx.lineTo(256, 420); ctx.lineTo(412, 350); ctx.stroke();
        
        ctx.fillStyle = '#500';
        for(let i=0; i<10; i++) {
            ctx.beginPath(); ctx.arc(Math.random()*512, Math.random()*512, Math.random()*20, 0, Math.PI*2); ctx.fill();
        }
    }
    return new THREE.CanvasTexture(cvs);
}

let texNormal = createFaceTexture(false);
let texScary = createFaceTexture(true);

const smilerGeo = new THREE.SphereGeometry(0.7, 32, 32);
const smilerMat = new THREE.MeshBasicMaterial({ map: texNormal });
const smiler = new THREE.Mesh(smilerGeo, smilerMat);
smiler.position.copy(mysteryBox.position);
smiler.visible = false;
scene.add(smiler);
smiler.userData = { type: 'smiler' };

const boxPieces = [];

// --- LOGIC / FLOW ---
let playerHeightOffset = 0.2;
camera.position.set(0, playerHeightOffset, 0);

function startWakingSequence() {
    playerHeightOffset = 0.2;
    setTimeout(() => {
        ui.lidTop.style.height = '20%';
        ui.lidBottom.style.height = '20%';
        setTimeout(() => {
            ui.lidTop.style.height = '40%';
            ui.lidBottom.style.height = '40%';
            setTimeout(() => {
                ui.lidTop.style.height = '0%';
                ui.lidBottom.style.height = '0%';
                let standInterval = setInterval(() => {
                    playerHeightOffset += 0.03;
                    if(playerHeightOffset >= 1.7) {
                        playerHeightOffset = 1.7;
                        clearInterval(standInterval);
                        currentState = STATE.FIND_KEY;
                        timeInState = 0;
                        flashText("The house is locked.");
                    }
                }, 30);
            }, 800);
        }, 800);
    }, 500);
}

function flashText(msg) {
    ui.flash.innerText = msg;
    ui.flash.style.display = 'block';
    ui.flash.style.opacity = 1;
    setTimeout(() => {
        ui.flash.style.opacity = 0;
        setTimeout(()=> ui.flash.style.display = 'none', 500);
    }, 2000);
}

function showDialog(text) {
    ui.dialogTxt.innerText = text;
    ui.dialog.style.display = 'block';
}
function hideDialog() {
    ui.dialog.style.display = 'none';
}

function handleZPress() {
    if(currentState === STATE.DEAD) return;

    if(currentState === STATE.NOTE1_READ) {
        ui.note.style.display = 'none';
        currentState = STATE.FIND_NOTE2;
        timeInState = 0;
        flashText("Part of the note is torn off...");
        interactables.push(note2);
        return;
    }

    if(currentState === STATE.NOTE2_READ) {
        ui.note.style.display = 'none';
        currentState = STATE.SEEK_BOX;
        timeInState = 0;
        flashText("Check the wooden box outside.");
        interactables.push(mysteryBox);
        return;
    }

    if(currentState === STATE.SMILER_TALK1) {
        showDialog("Ask me a question. I know almost everything.");
        currentState = STATE.SMILER_TALK2;
        return;
    }

    if(currentState === STATE.SMILER_TALK2) {
        hideDialog();
        currentState = STATE.INPUT_Q;
        document.exitPointerLock();
        ui.inputView.style.display = 'block';
        ui.inputField.focus();
        return;
    }

    if(currentState === STATE.READ_A) {
        hideDialog();
        startSmilerCountdown();
        return;
    }

    // Interaction Raycast Triggers
    if(activeInteractable) {
        let type = activeInteractable.userData.type;

        if(type === 'key' && currentState === STATE.FIND_KEY) {
            hasKey = true;
            scene.remove(keyMesh);
            interactables.splice(interactables.indexOf(keyMesh), 1);
            currentState = STATE.ENTER_HOUSE;
            timeInState = 0;
            flashText("Got the key. Unlock the door.");
        }
        else if(type === 'door' && !doorMoving) {
            if (isDoorBarricaded && hasWood) {
                flashText("The door is barricaded tightly!");
                return;
            }
            if (!isDoorBarricaded && hasWood && !doorOpen) {
                isDoorBarricaded = true;
                barricadeGroup.visible = true;
                flashText("Door Barricaded!");
                return;
            }
            if(!doorOpen && !hasKey) {
                flashText("It's locked tight.");
                return;
            }
            doorMoving = true;
            let target = doorOpen ? 0 : Math.PI/2;
            let step = doorOpen ? -0.05 : 0.05;
            
            if(!doorOpen) {
                solidWalls[doorColliderIdx].minX = 0; 
                solidWalls[doorColliderIdx].maxX = 0;
            } else {
                solidWalls[doorColliderIdx].minX = 0;
                solidWalls[doorColliderIdx].maxX = 2.5;
            }

            let anim = setInterval(() => {
                doorPivot.rotation.y += step;
                if((step > 0 && doorPivot.rotation.y >= target) || (step < 0 && doorPivot.rotation.y <= target)) {
                    doorPivot.rotation.y = target;
                    doorOpen = !doorOpen;
                    doorMoving = false;
                    clearInterval(anim);
                }
            }, 16);
        }
        else if (type === 'note1' && currentState === STATE.ENTER_HOUSE) {
            ui.noteTxt.innerText = "They're coming...";
            ui.note.style.display = 'flex';
            currentState = STATE.NOTE1_READ;
        }
        else if (type === 'note2' && currentState === STATE.FIND_NOTE2) {
            ui.noteTxt.innerText = "...I need to run. Check the box outside.";
            ui.note.style.display = 'flex';
            currentState = STATE.NOTE2_READ;
        }
        else if (type === 'note3') {
            ui.noteTxt.innerText = "Hold the mirror up to his face. It is the only reflection of what he truly is.";
            ui.note.style.display = 'flex';
        }
        else if (type === 'box' && currentState === STATE.SEEK_BOX) {
            if(!hasCrowbar) {
                flashText("It's nailed shut! I need a tool.");
                currentState = STATE.FIND_CROWBAR;
                timeInState = 0;
                interactables.push(crowbarMesh);
            }
        }
        else if (type === 'crowbar' && currentState === STATE.FIND_CROWBAR) {
            hasCrowbar = true;
            scene.remove(crowbarMesh);
            interactables.splice(interactables.indexOf(crowbarMesh), 1);
            currentState = STATE.BREAK_BOX;
            timeInState = 0;
            flashText("Got crowbar! Go smash the box.");
        }
        else if (type === 'box' && currentState === STATE.BREAK_BOX) {
            mysteryBox.visible = false;
            for(let i=0; i<5; i++){
                let p = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5), boxMat);
                p.position.copy(mysteryBox.position);
                p.userData.vel = new THREE.Vector3((Math.random()-0.5)*5, Math.random()*5, (Math.random()-0.5)*5);
                scene.add(p);
                boxPieces.push(p);
            }
            solidWalls = solidWalls.filter(w => !(w.minX == 10 - 0.75 && w.maxZ == -8 + 0.75));
            interactables.splice(interactables.indexOf(mysteryBox), 1);
            
            smiler.position.set(28, 1.2, -35); 
            smiler.visible = true;
            interactables.push(smiler);
            
            currentState = STATE.HUNT_SMILER;
            timeInState = 0;
            flashText("Something darted into the woods!");
        }
        else if (type === 'smiler' && currentState === STATE.HUNT_SMILER) {
            currentState = STATE.SMILER_TALK1;
            timeInState = 0;
            showDialog("Hi! I'm smiler! I know a lot.");
        }
        else if (type === 'trapdoor') {
            // Trapdoor can ONLY be toggled if player is on the 1st floor (y > -1.0)
            if (camera.position.y < -1.0) {
                flashText("You can only reach the trapdoor from the 1st floor!");
                return;
            }
            trapdoorOpen = !trapdoorOpen;
            let targetRot = trapdoorOpen ? -Math.PI / 1.8 : 0;
            let anim = setInterval(() => {
                if (trapdoorOpen) {
                    trapPivot.rotation.x -= 0.05;
                    if (trapPivot.rotation.x <= targetRot) {
                        trapPivot.rotation.x = targetRot;
                        clearInterval(anim);
                    }
                } else {
                    trapPivot.rotation.x += 0.05;
                    if (trapPivot.rotation.x >= 0) {
                        trapPivot.rotation.x = 0;
                        clearInterval(anim);
                    }
                }
            }, 16);
            flashText(trapdoorOpen ? "Trapdoor opened." : "Trapdoor closed.");
        }
        else if (type === 'ladder') {
            if (!isClimbingLadder && camera.position.y < -1.0) {
                isClimbingLadder = true;
                if (!trapdoorOpen) {
                    trapdoorOpen = true;
                    trapPivot.rotation.x = -Math.PI / 1.8;
                }
                let climbAnim = setInterval(() => {
                    camera.position.y += 0.15;
                    camera.position.x += (-1.0 - camera.position.x) * 0.1;
                    camera.position.z += (-15.0 - camera.position.z) * 0.1;
                    if (camera.position.y >= 1.7) {
                        camera.position.y = 1.7;
                        isClimbingLadder = false;
                        clearInterval(climbAnim);
                    }
                }, 16);
            }
        }
        else if (type === 'axe') {
            hasAxe = true;
            scene.remove(axeGroup);
            interactables.splice(interactables.indexOf(head), 1);
            flashText("Picked up the Axe!");
        }
        else if (type === 'tree') {
            if (hasAxe) {
                let treeGrp = activeInteractable.userData.parentGroup;
                scene.remove(treeGrp);
                hasWood = true;
                hasAxe = false;
                flashText("Chipped down tree! Got Wood. (Axe broke!)");
            } else {
                flashText("I need an axe to cut down trees.");
            }
        }
        else if (type === 'mirror') {
            hasMirror = true;
            scene.remove(mirrorGroup);
            interactables.splice(interactables.indexOf(mGlass), 1);
            flashText("Grabbed the Hand Mirror. Wait in silence...");
        }
    }
}

function startSmilerCountdown() {
    currentState = STATE.SMILER_COUNTING;
    smilerCountdown = 15;
    showDialog("I am going to count to 15. Then I will come for you... " + smilerCountdown);
    let interval = setInterval(() => {
        smilerCountdown--;
        if (smilerCountdown > 0) {
            showDialog("I am going to count to 15. Then I will come for you... " + smilerCountdown);
        } else {
            clearInterval(interval);
            hideDialog();
            smiler.material.map = texScary;
            smiler.scale.set(1.5, 1.5, 1.5);
            smilerSpeed = 7.0;
            currentState = STATE.CHASE;
            smilerAttackTime = 0;
            flashText("RUN! HE IS COMING!");
        }
    }, 1000);
}

// Groq API Query
ui.inputBtn.addEventListener('click', async () => {
    let q = ui.inputField.value.trim();
    if(!q) q = "What are you?";
    
    ui.inputView.style.display = 'none';
    document.body.requestPointerLock();
    currentState = STATE.WAIT_Q;
    showDialog("...");

    try {
        const res = await fetch("/api/groq", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: q })
        });
        if (!res.ok) throw new Error("API route failed");
        const data = await res.json();
        showDialog(data.answer);
    } catch(e) {
        showDialog("There is no escape from what is coming.");
    }
    currentState = STATE.READ_A;
});

ui.inputField.addEventListener('keydown', (e) => {
    if(e.code === 'Enter') ui.inputBtn.click();
});

// --- MAIN LOOP ---
const raycaster = new THREE.Raycaster();
const screenCenter = new THREE.Vector2(0, 0);
let activeInteractable = null;
let lastTime = performance.now();

function checkCollisions(newPos) {
    let r = 0.4;
    // Trapdoor Hole region check (x: -2 to 0, z: -16 to -14)
    if (trapdoorOpen && newPos.x > -2 && newPos.x < 0 && newPos.z > -16 && newPos.z < -14) {
        return false;
    }
    for(let w of solidWalls) {
        if (newPos.x + r > w.minX && newPos.x - r < w.maxX &&
            newPos.z + r > w.minZ && newPos.z - r < w.maxZ) {
            if (newPos.y > -1.0) return true;
        }
    }
    return false;
}

function updateGuidanceAndHints(dt) {
    if(currentState <= STATE.WAKING || currentState >= STATE.CHASE) {
        ui.hint.style.opacity = 0;
        guideArrow.visible = false;
        return;
    }

    timeInState += dt;
    let targetObj = null;
    let hintMsg = "";

    if (currentState === STATE.FIND_KEY) {
        hintMsg = "Search the edge of the forest for a key on a wooden post.";
        targetObj = keyMesh;
    } else if (currentState === STATE.ENTER_HOUSE) {
        hintMsg = "Use the key to unlock the house door ahead.";
        targetObj = doorMesh;
    } else if (currentState === STATE.FIND_NOTE2) {
        hintMsg = "Search on top of the bed in the corner for the rest of the note.";
        targetObj = note2;
    } else if (currentState === STATE.SEEK_BOX) {
        hintMsg = "Go outside and check the wooden box on the side.";
        targetObj = mysteryBox;
    } else if (currentState === STATE.FIND_CROWBAR) {
        hintMsg = "Check behind the house to find a tool to pry open the box.";
        targetObj = crowbarMesh;
    } else if (currentState === STATE.BREAK_BOX) {
        hintMsg = "Break the wooden box using the crowbar.";
        targetObj = mysteryBox;
    } else if (currentState === STATE.HUNT_SMILER) {
        hintMsg = "Locate the glowing yellow face lurking deep in the dark forest.";
        targetObj = smiler;
    }

    if (timeInState > 10 && hintMsg) {
        ui.hint.innerText = hintMsg;
        ui.hint.style.opacity = 1;
        ui.hint.style.display = 'block';
    } else {
        ui.hint.style.opacity = 0;
    }

    if (timeInState > 25 && targetObj) {
        let targetPos = new THREE.Vector3();
        targetObj.getWorldPosition(targetPos);
        
        let dist = camera.position.distanceTo(targetPos);
        if (dist > 3.5) {
            guideArrow.position.set(targetPos.x, targetPos.y + 2.2 + Math.sin(performance.now() * 0.005) * 0.2, targetPos.z);
            guideArrow.visible = true;
        } else {
            guideArrow.visible = false;
        }
    } else {
        guideArrow.visible = false;
    }
}

function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    updateGuidanceAndHints(dt);

    if (!isClimbingLadder) {
        // Dynamic Floor height checks
        let inHoleArea = (trapdoorOpen && camera.position.x > -2 && camera.position.x < 0 && camera.position.z > -16 && camera.position.z < -14);
        let floorHeight = inHoleArea ? -2.3 : (camera.position.y < -1.0 ? -2.3 : 1.7);

        // Normal Gravity physics
        verticalVelocity -= 15.0 * dt;
        camera.position.y += verticalVelocity * dt;

        if (camera.position.y <= floorHeight) {
            camera.position.y = floorHeight;
            verticalVelocity = 0;
            isGrounded = true;
        }

        // Player Movement
        if (document.pointerLockElement === document.body && currentState !== STATE.DEAD) {
            direction.z = Number(keys.w) - Number(keys.s);
            direction.x = Number(keys.d) - Number(keys.a);
            direction.normalize();

            const camDir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
            camDir.y = 0; camDir.normalize();
            const camRight = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
            camRight.y = 0; camRight.normalize();

            const moveVec = new THREE.Vector3();
            moveVec.addScaledVector(camDir, direction.z);
            moveVec.addScaledVector(camRight, direction.x);
            
            let targetSpeed = (keys.w || keys.a || keys.s || keys.d) ? speed : 0;
            let oldX = camera.position.x;
            let oldZ = camera.position.z;
            
            let nextX = oldX + moveVec.x * targetSpeed * dt;
            if(!checkCollisions(new THREE.Vector3(nextX, camera.position.y, oldZ))) {
                camera.position.x = nextX;
            }
            
            let nextZ = oldZ + moveVec.z * targetSpeed * dt;
            if(!checkCollisions(new THREE.Vector3(camera.position.x, camera.position.y, nextZ))) {
                camera.position.z = nextZ;
            }
        }
    }

    // Interaction Raycast
    activeInteractable = null;
    ui.prompt.style.display = 'none';
    if(currentState !== STATE.DEAD && currentState !== STATE.INPUT_Q && currentState !== STATE.NOTE1_READ && currentState !== STATE.NOTE2_READ && !isClimbingLadder) {
        raycaster.setFromCamera(screenCenter, camera);
        const intersects = raycaster.intersectObjects(interactables);
        if (intersects.length > 0 && intersects[0].distance < 4) {
            let obj = intersects[0].object;
            let type = obj.userData.type;
            
            let show = false;
            let pText = "";
            
            if(type === 'key' && currentState === STATE.FIND_KEY) { show = true; pText = "Z to pick up key"; }
            else if(type === 'door') { 
                show = true; 
                if (hasWood && !isDoorBarricaded && !doorOpen) pText = "Z to barricade door";
                else pText = doorOpen ? "Z to close" : "Z to open"; 
            }
            else if(type === 'note1' && currentState === STATE.ENTER_HOUSE) { show = true; pText = "Z to read note"; }
            else if(type === 'note2' && currentState === STATE.FIND_NOTE2) { show = true; pText = "Z to read torn note"; }
            else if(type === 'note3') { show = true; pText = "Z to read basement note"; }
            else if(type === 'box' && (currentState === STATE.SEEK_BOX || currentState === STATE.BREAK_BOX)) { 
                show = true; 
                pText = hasCrowbar ? "Z to smash box" : "Z to inspect box"; 
            }
            else if(type === 'crowbar' && currentState === STATE.FIND_CROWBAR) { show = true; pText = "Z to take crowbar"; }
            else if(type === 'smiler' && currentState === STATE.HUNT_SMILER) { show = true; pText = "Z to talk"; }
            else if(type === 'trapdoor') { 
                if (camera.position.y > -1.0) {
                    show = true; 
                    pText = trapdoorOpen ? "Z to close trapdoor" : "Z to open trapdoor"; 
                }
            }
            else if(type === 'ladder') {
                if (camera.position.y < -1.0) {
                    show = true;
                    pText = "Z to climb ladder";
                }
            }
            else if(type === 'axe') { show = true; pText = "Z to take Axe"; }
            else if(type === 'tree') { show = true; pText = hasAxe ? "Z to chop tree" : "Need Axe to chop"; }
            else if(type === 'mirror') { show = true; pText = "Z to take Hand Mirror"; }
            
            if(show) {
                activeInteractable = obj;
                ui.prompt.innerText = pText;
                ui.prompt.style.display = 'block';
            }
        }
    }

    // Box pieces physics
    for(let i=boxPieces.length-1; i>=0; i--){
        let p = boxPieces[i];
        p.position.addScaledVector(p.userData.vel, dt);
        p.userData.vel.y -= 9.8 * dt;
        p.rotation.x += dt; p.rotation.y += dt;
        if(p.position.y < 0) {
            scene.remove(p);
            boxPieces.splice(i,1);
        }
    }

    // Chase & Barricade Destruction Logic
    if(currentState === STATE.CHASE) {
        smiler.lookAt(camera.position);
        
        let doorTargetPos = new THREE.Vector3(0, 1.2, -9.5);
        if (isDoorBarricaded && !barrierFallen) {
            let distToDoor = smiler.position.distanceTo(doorTargetPos);
            if (distToDoor > 1.0) {
                let dir = new THREE.Vector3().subVectors(doorTargetPos, smiler.position).normalize();
                smiler.position.addScaledVector(dir, smilerSpeed * dt);
            } else {
                smilerAttackTime += dt;
                
                smiler.position.x = doorTargetPos.x + (Math.random() - 0.5) * 0.2;
                barricadeGroup.position.x = (Math.random() - 0.5) * 0.1;

                if (smilerAttackTime > 20 && !doorFallen) {
                    doorFallen = true;
                    doorPivot.rotation.x = Math.PI / 2;
                    flashText("The front door collapsed!");
                }
                if (smilerAttackTime > 30) {
                    barrierFallen = true;
                    barricadeGroup.visible = false;
                    flashText("THE BARRICADE CRACKED AND SHATTERED!");
                }
            }
        } else {
            let dir = new THREE.Vector3().subVectors(camera.position, smiler.position);
            dir.y = 0; dir.normalize();
            smiler.position.addScaledVector(dir, smilerSpeed * dt);
            
            let distToPlayer = smiler.position.distanceTo(camera.position);
            if(distToPlayer < 1.5) {
                currentState = STATE.DEAD;
                ui.gameOver.style.display = 'flex';
                document.exitPointerLock();
            }
        }
    }

    renderer.render(scene, camera);
}

// Start loop
animate();
</script>
