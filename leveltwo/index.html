<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Inevitable - Level 2: Inside Smiler</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050201;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlays */
        .overlay {
            position: absolute;
            pointer-events: none;
            display: none;
            z-index: 50;
        }

        #crosshair {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 200, 150, 0.6);
            font-size: 20px;
            display: block;
        }

        #interact-prompt {
            top: 55%;
            left: 50%;
            transform: translateX(-50%);
            color: #ffe0b2;
            font-size: 22px;
            text-shadow: 2px 2px 0px #000;
        }

        #flash-text {
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            color: #ffaa55;
            font-size: 32px;
            text-shadow: 3px 3px 0px #000;
            opacity: 0;
            transition: opacity 0.5s;
            display: block;
            text-align: center;
        }

        #hint-text {
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            color: #d1b894;
            font-size: 18px;
            background: rgba(15, 10, 5, 0.85);
            border: 1px solid #7a5c37;
            padding: 10px 20px;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 1s;
            display: block;
        }

        #diary-view {
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 5, 2, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 60;
            pointer-events: auto;
        }

        #diary-view .paper {
            background: #d4b185;
            color: #2b1704;
            padding: 40px;
            border-radius: 3px;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            max-width: 550px;
            font-family: 'Georgia', serif;
            line-height: 1.6;
            border: 2px solid #8c5d2e;
        }

        #diary-view h3 {
            margin-top: 0;
            color: #591d0b;
            border-bottom: 1px dashed #7a461e;
            padding-bottom: 5px;
        }

        #diary-view .sub {
            color: #bbb;
            margin-top: 20px;
            font-size: 14px;
            font-family: 'Courier New', Courier, monospace;
        }

        #status-hud {
            top: 20px;
            left: 20px;
            color: #e0aa6b;
            font-size: 18px;
            display: block;
            text-shadow: 1px 1px 2px #000;
        }

        /* End Level & Game Over Screens */
        #screen-overlay {
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            pointer-events: auto;
        }

        #screen-overlay h1 {
            color: #ff4400;
            font-size: 3vw;
            text-shadow: 0 0 15px #ff1100;
            text-align: center;
            margin-bottom: 25px;
        }

        #action-btn {
            padding: 15px 35px;
            font-size: 22px;
            font-family: 'Courier New', Courier, monospace;
            background: #1c0d02;
            color: #ffaa55;
            border: 2px solid #a85513;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 120, 0, 0.4);
            transition: all 0.3s ease;
        }

        #action-btn:hover {
            background: #883300;
            color: #fff;
            box-shadow: 0 0 25px rgba(255, 120, 0, 0.9);
        }

        .click-to-start {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: #0d0603; color: #e0aa6b; display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 200; font-size: 24px; cursor: pointer; text-align: center;
        }
    </style>
    <!-- Three.js & Tone.js CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body>

    <div id="start-screen" class="click-to-start">
        <h2>LEVEL 2: AWAKE IN THE DESERT</h2>
        <p style="font-size: 16px; color: #a88158;">You are inside Smiler.<br>Find the 3 hidden buttons to raise the calcified exit gate.</p>
        <span style="font-size: 20px; border: 1px solid #e0aa6b; padding: 10px 20px; margin-top: 20px;">Click to Begin</span>
    </div>

    <div id="crosshair" class="overlay">+</div>
    <div id="status-hud" class="overlay">Gate Buttons Activated: <span id="button-count">0</span>/3</div>
    <div id="interact-prompt" class="overlay"></div>
    <div id="flash-text" class="overlay"></div>
    <div id="hint-text" class="overlay"></div>

    <div id="diary-view" class="overlay">
        <div class="paper">
            <h3 id="diary-title">Victim's Journal</h3>
            <p id="diary-text">...</p>
        </div>
        <div class="sub">Press Z to close</div>
    </div>

    <div id="screen-overlay" class="overlay">
        <h1 id="screen-title">YOU HAVE ESCAPED THE DESERT</h1>
        <button id="action-btn">Proceed to Level 3</button>
    </div>

<script>
// --- TONE.JS AUDIO ENGINE ---
let audioInitialized = false;
let synthHeartbeat, synthAmbience, synthStep, synthStalkerSound;

function initAudio() {
    if (audioInitialized) return;
    Tone.start();

    // Pulse / Heartbeat
    synthHeartbeat = new Tone.MembraneSynth({
        pitchDecay: 0.05,
        octaves: 4,
        oscillator: { type: "sine" },
        envelope: { attack: 0.01, decay: 0.4, sustain: 0.01, release: 0.4 }
    }).toDestination();
    synthHeartbeat.volume.value = -12;

    // Desert Ambient Drone
    const filter = new Tone.Filter(300, "lowpass").toDestination();
    synthAmbience = new Tone.NoiseSynth({
        noise: { type: "brown" },
        envelope: { attack: 2, decay: 0.1, sustain: 1, release: 2 }
    }).connect(filter);
    synthAmbience.volume.value = -20;
    synthAmbience.triggerAttack();

    // Stalker Vocalization
    synthStalkerSound = new Tone.AMSynth({
        harmonicity: 2.5,
        oscillator: { type: "sawtooth" },
        envelope: { attack: 0.1, decay: 0.2, sustain: 0.2, release: 0.3 }
    }).toDestination();
    synthStalkerSound.volume.value = -16;

    audioInitialized = true;
}

function playHeartbeat() {
    if (!audioInitialized) return;
    synthHeartbeat.triggerAttackRelease("C1", "8n");
    setTimeout(() => synthHeartbeat.triggerAttackRelease("A0", "8n"), 250);
}

function playStalkerGroan() {
    if (!audioInitialized) return;
    synthStalkerSound.triggerAttackRelease("E1", "0.4");
}

// --- GAME STATE ---
let buttonsPressed = 0;
let isReadingDiary = false;
let isGameOver = false;
let isVictorious = false;
let hintTimer = 0;

const ui = {
    start: document.getElementById('start-screen'),
    prompt: document.getElementById('interact-prompt'),
    flash: document.getElementById('flash-text'),
    hint: document.getElementById('hint-text'),
    diary: document.getElementById('diary-view'),
    diaryTitle: document.getElementById('diary-title'),
    diaryText: document.getElementById('diary-text'),
    btnCount: document.getElementById('button-count'),
    screenOverlay: document.getElementById('screen-overlay'),
    screenTitle: document.getElementById('screen-title'),
    actionBtn: document.getElementById('action-btn')
};

// --- THREE.JS SETUP ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a0f08);
scene.fog = new THREE.FogExp2(0x1a0f08, 0.015); // Fog density for vast desert feel

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffb077, 0.4);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xff7733, 0.7);
sunLight.position.set(30, 50, 20);
scene.add(sunLight);

// Dynamic 3D Guidance Arrow
const arrowGeo = new THREE.ConeGeometry(0.5, 1.5, 8);
arrowGeo.rotateX(Math.PI);
const arrowMat = new THREE.MeshBasicMaterial({ color: 0xffa500, wireframe: true });
const guideArrow = new THREE.Mesh(arrowGeo, arrowMat);
guideArrow.visible = false;
scene.add(guideArrow);

// --- CONTROLS & MOVEMENT ---
let pitch = 0, yaw = 0;
const PI_2 = Math.PI / 2;
const keys = { w: false, a: false, s: false, d: false, z: false };
let baseSpeed = 7.0;
let currentSpeed = 7.0;
let playerPos = new THREE.Vector3(0, 1.7, 80); // Start at desert entrance
camera.position.copy(playerPos);

document.addEventListener('mousemove', (e) => {
    if (document.pointerLockElement === document.body && !isGameOver && !isVictorious && !isReadingDiary) {
        yaw -= e.movementX * 0.002;
        pitch -= e.movementY * 0.002;
        pitch = Math.max(-PI_2 + 0.1, Math.min(PI_2 - 0.1, pitch));
        
        const qx = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), pitch);
        const qy = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        camera.quaternion.copy(qy).multiply(qx);
    }
});

document.addEventListener('keydown', (e) => {
    if(e.code === 'KeyW') keys.w = true;
    if(e.code === 'KeyA') keys.a = true;
    if(e.code === 'KeyS') keys.s = true;
    if(e.code === 'KeyD') keys.d = true;
    if(e.code === 'KeyZ') {
        if (!keys.z) handleZPress();
        keys.z = true;
    }
});
document.addEventListener('keyup', (e) => {
    if(e.code === 'KeyW') keys.w = false;
    if(e.code === 'KeyA') keys.a = false;
    if(e.code === 'KeyS') keys.s = false;
    if(e.code === 'KeyD') keys.d = false;
    if(e.code === 'KeyZ') keys.z = false;
});

ui.start.addEventListener('click', () => {
    initAudio();
    ui.start.style.display = 'none';
    document.body.requestPointerLock();
    document.getElementById('crosshair').style.display = 'block';
    document.getElementById('status-hud').style.display = 'block';
    flashText("Find 3 Sandstone Buttons to raise the Gate.");
});

document.body.addEventListener('click', () => {
    if (ui.start.style.display === 'none' && !isGameOver && !isVictorious && !isReadingDiary) {
        document.body.requestPointerLock();
    }
});

// --- WORLD BUILDING (2X - 3X MAP SIZE: 180x220) ---
const interactables = [];
const solidWalls = [];
const doors = [];
const acidPools = [];
const buttons = [];
const stalkers = [];

function addWallCollider(x, z, w, d) {
    solidWalls.push({ minX: x - w/2, maxX: x + w/2, minZ: z - d/2, maxZ: z + d/2 });
}

// Sand Ground
const groundGeo = new THREE.PlaneGeometry(220, 260);
const groundMat = new THREE.MeshLambertMaterial({ color: 0xc28d53 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Wall Materials
const sandstoneMat = new THREE.MeshLambertMaterial({ color: 0xa8733e });
const darkSandstoneMat = new THREE.MeshLambertMaterial({ color: 0x6e4723 });
const boneMat = new THREE.MeshLambertMaterial({ color: 0xd9caa7 });
const acidMat = new THREE.MeshBasicMaterial({ color: 0x33ff33, transparent: true, opacity: 0.7 });

// Outer City Boundary
function buildOuterWalls() {
    const wallHeight = 12;
    // North, South, East, West enclosing walls
    const wN = new THREE.Mesh(new THREE.BoxGeometry(220, wallHeight, 4), sandstoneMat);
    wN.position.set(0, wallHeight/2, -130); scene.add(wN); addWallCollider(0, -130, 220, 4);

    const wS = new THREE.Mesh(new THREE.BoxGeometry(220, wallHeight, 4), sandstoneMat);
    wS.position.set(0, wallHeight/2, 130); scene.add(wS); addWallCollider(0, 130, 220, 4);

    const wE = new THREE.Mesh(new THREE.BoxGeometry(4, wallHeight, 260), sandstoneMat);
    wE.position.set(110, wallHeight/2, 0); scene.add(wE); addWallCollider(110, 0, 4, 260);

    const wW = new THREE.Mesh(new THREE.BoxGeometry(4, wallHeight, 260), sandstoneMat);
    wW.position.set(-110, wallHeight/2, 0); scene.add(wW); addWallCollider(-110, 0, 4, 260);
}
buildOuterWalls();

// Build Two-Story Sandstone House
function buildHouse(x, z, width, depth, doorsConfig, diaryData) {
    const wallThick = 0.6;
    const h1 = 4.5;
    const h2 = 4.5;
    const totalH = h1 + h2;

    // Ground Floor Walls with door cutout
    const backWall = new THREE.Mesh(new THREE.BoxGeometry(width, totalH, wallThick), sandstoneMat);
    backWall.position.set(x, totalH/2, z - depth/2); scene.add(backWall);
    addWallCollider(x, z - depth/2, width, wallThick);

    const leftWall = new THREE.Mesh(new THREE.BoxGeometry(wallThick, totalH, depth), sandstoneMat);
    leftWall.position.set(x - width/2, totalH/2, z); scene.add(leftWall);
    addWallCollider(x - width/2, z, wallThick, depth);

    const rightWall = new THREE.Mesh(new THREE.BoxGeometry(wallThick, totalH, depth), sandstoneMat);
    rightWall.position.set(x + width/2, totalH/2, z); scene.add(rightWall);
    addWallCollider(x + width/2, z, wallThick, depth);

    // Front Wall Split for Door
    const frontW1 = new THREE.Mesh(new THREE.BoxGeometry((width - 3)/2, totalH, wallThick), sandstoneMat);
    frontW1.position.set(x - (width/4 + 0.75), totalH/2, z + depth/2); scene.add(frontW1);
    addWallCollider(x - (width/4 + 0.75), z + depth/2, (width - 3)/2, wallThick);

    const frontW2 = new THREE.Mesh(new THREE.BoxGeometry((width - 3)/2, totalH, wallThick), sandstoneMat);
    frontW2.position.set(x + (width/4 + 0.75), totalH/2, z + depth/2); scene.add(frontW2);
    addWallCollider(x + (width/4 + 0.75), z + depth/2, (width - 3)/2, wallThick);

    // Lintels above door (1st floor & 2nd floor)
    const lintel = new THREE.Mesh(new THREE.BoxGeometry(3, totalH - 3.5, wallThick), sandstoneMat);
    lintel.position.set(x, 3.5 + (totalH - 3.5)/2, z + depth/2); scene.add(lintel);

    // Middle Floor (2nd Story Floor)
    const midFloor = new THREE.Mesh(new THREE.BoxGeometry(width - wallThick, 0.3, depth - wallThick), darkSandstoneMat);
    midFloor.position.set(x, h1, z); scene.add(midFloor);

    // Roof Floor
    const roof = new THREE.Mesh(new THREE.BoxGeometry(width + 0.4, 0.4, depth + 0.4), darkSandstoneMat);
    roof.position.set(x, totalH, z); scene.add(roof);

    // Openable Wooden Door
    const doorPivot = new THREE.Group();
    doorPivot.position.set(x - 1.5, 0, z + depth/2);
    const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(3, 3.5, 0.2), new THREE.MeshLambertMaterial({ color: 0x4a2a0c }));
    doorMesh.position.set(1.5, 1.75, 0);
    doorPivot.add(doorMesh); scene.add(doorPivot);
    
    doorMesh.userData = { type: 'door', pivot: doorPivot, open: false, moving: false };
    interactables.push(doorMesh);
    doors.push(doorMesh);

    // Add Staircase to 2nd story
    for(let i=0; i<9; i++) {
        let step = new THREE.Mesh(new THREE.BoxGeometry(2, 0.5, 0.6), darkSandstoneMat);
        step.position.set(x + width/2 - 1.5, 0.25 + i*0.5, (z - depth/2 + 1.5) + i*0.5);
        scene.add(step);
    }

    // Diary Page Placement
    if (diaryData) {
        const diaryGeo = new THREE.PlaneGeometry(0.5, 0.7);
        const diaryMesh = new THREE.Mesh(diaryGeo, new THREE.MeshBasicMaterial({ color: 0xffeedd }));
        diaryMesh.rotation.x = -Math.PI / 2;
        diaryMesh.position.set(x, h1 + 0.16, z); // Top floor center
        diaryMesh.userData = { type: 'diary', title: diaryData.title, text: diaryData.text };
        scene.add(diaryMesh);
        interactables.push(diaryMesh);
    }
}

// Generate City Buildings with Paths
const houseDiaries = [
    { title: "Victim Entry #12", text: "The sky isn't real. The sand isn't sand. We are inside a giant beast. The desert is its gullet." },
    { title: "Victim Entry #27", text: "The brown wanderers... they are blind. They only react if you practically walk into their arms." },
    { title: "Victim Entry #41", text: "Three stone mechanisms are hidden in the northern, eastern, and western quarters. Press them all to raise the Bone Gate." }
];

buildHouse(-40, 30, 12, 12, true, houseDiaries[0]);
buildHouse(40, 20, 14, 10, true, houseDiaries[1]);
buildHouse(-50, -40, 10, 14, true, houseDiaries[2]);
buildHouse(50, -50, 12, 12, true, null);
buildHouse(0, -90, 16, 12, true, null);

// Rare Stomach Acid / Tar Pools (Only 2 in entire map)
function createAcidPool(x, z, r) {
    const pool = new THREE.Mesh(new THREE.CircleGeometry(r, 16), acidMat);
    pool.rotation.x = -Math.PI / 2;
    pool.position.set(x, 0.02, z);
    scene.add(pool);
    acidPools.push({ x, z, radius: r });
}
createAcidPool(-15, 10, 4.5);
createAcidPool(30, -20, 5.0);

// Calcified Ribcage Exit Gate (Main Exit)
const gateGroup = new THREE.Group();
gateGroup.position.set(0, 0, -128);

for(let i = -4; i <= 4; i++) {
    let rib = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 10), boneMat);
    rib.position.set(i * 1.2, 5, 0);
    gateGroup.add(rib);
}
scene.add(gateGroup);
addWallCollider(0, -128, 12, 2);

// Hidden Sandstone Buttons
function createButton(x, z, id) {
    const base = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.2, 1.5), sandstoneMat);
    base.position.set(x, 0.6, z); scene.add(base);
    addWallCollider(x, z, 1.5, 1.5);

    const btnMesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.4, 0.8), new THREE.MeshLambertMaterial({ color: 0xff3300 }));
    btnMesh.position.set(x, 1.3, z); scene.add(btnMesh);
    btnMesh.userData = { type: 'button', id: id, pressed: false };
    interactables.push(btnMesh);
    buttons.push(btnMesh);
}

createButton(-80, 50, 1);
createButton(85, -10, 2);
createButton(-20, -110, 3);

// --- IMMUNE SYSTEM ENEMIES (3 Slow, Mostly Blind Stalkers) ---
function createStalker(x, z) {
    const group = new THREE.Group();
    
    // Dark brown body mesh
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0x3d2314 });
    const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.4, 2.8), bodyMat);
    torso.position.y = 1.4; group.add(torso);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.5, 12, 12), bodyMat);
    head.position.y = 3.0; group.add(head);

    group.position.set(x, 0, z);
    scene.add(group);

    stalkers.push({
        mesh: group,
        speed: 3.2, // Half player's base speed
        patrolTarget: new THREE.Vector3(x + (Math.random()-0.5)*40, 0, z + (Math.random()-0.5)*40),
        groanTimer: Math.random() * 5
    });
}

createStalker(-30, 0);
createStalker(35, 40);
createStalker(10, -60);

// --- INTERACTION & LOGIC ---
let activeInteractable = null;

function handleZPress() {
    if (isReadingDiary) {
        ui.diary.style.display = 'none';
        isReadingDiary = false;
        document.body.requestPointerLock();
        return;
    }

    if (activeInteractable) {
        let type = activeInteractable.userData.type;

        if (type === 'door') {
            let data = activeInteractable.userData;
            if (data.moving) return;
            data.moving = true;
            let targetAngle = data.open ? 0 : Math.PI / 2;
            let step = data.open ? -0.05 : 0.05;

            let anim = setInterval(() => {
                data.pivot.rotation.y += step;
                if ((step > 0 && data.pivot.rotation.y >= targetAngle) || (step < 0 && data.pivot.rotation.y <= targetAngle)) {
                    data.pivot.rotation.y = targetAngle;
                    data.open = !data.open;
                    data.moving = false;
                    clearInterval(anim);
                }
            }, 16);
        }
        else if (type === 'diary') {
            ui.diaryTitle.innerText = activeInteractable.userData.title;
            ui.diaryText.innerText = activeInteractable.userData.text;
            ui.diary.style.display = 'flex';
            isReadingDiary = true;
            document.exitPointerLock();
        }
        else if (type === 'button' && !activeInteractable.userData.pressed) {
            activeInteractable.userData.pressed = true;
            activeInteractable.position.y -= 0.2; // Press down animation
            activeInteractable.material.color.setHex(0x00ff00);
            buttonsPressed++;
            ui.btnCount.innerText = buttonsPressed;

            playHeartbeat();
            flashText(`Gate Mechanism Activated (${buttonsPressed}/3)`);

            // Lift exit gate partially
            gateGroup.position.y += 2.5;

            if (buttonsPressed === 3) {
                flashText("THE GATE IS FULLY OPENED! ESCAPE TO THE NORTH!");
                // Remove collision block for gate
                solidWalls.splice(solidWalls.findIndex(w => w.minZ === -128), 1);
            }
        }
    }
}

function flashText(msg) {
    ui.flash.innerText = msg;
    ui.flash.style.opacity = 1;
    setTimeout(() => { ui.flash.style.opacity = 0; }, 3000);
}

// --- COLLISION DETECTOR ---
function checkCollisions(newPos) {
    let r = 0.5;
    for(let w of solidWalls) {
        if (newPos.x + r > w.minX && newPos.x - r < w.maxX &&
            newPos.z + r > w.minZ && newPos.z - r < w.maxZ) {
            return true;
        }
    }
    return false;
}

// --- MAIN GAME LOOP ---
let lastTime = performance.now();

function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    if (isGameOver || isVictorious) return;

    // 1. Acid Pool Speed Reduction
    currentSpeed = baseSpeed;
    for (let pool of acidPools) {
        let dist = Math.hypot(camera.position.x - pool.x, camera.position.z - pool.z);
        if (dist < pool.radius) {
            currentSpeed = baseSpeed * 0.35; // Slow down drastically in stomach acid
            break;
        }
    }

    // 2. Player Movement
    if (document.pointerLockElement === document.body && !isReadingDiary) {
        let dirX = Number(keys.d) - Number(keys.a);
        let dirZ = Number(keys.w) - Number(keys.s);
        let moveDir = new THREE.Vector3(dirX, 0, -dirZ).normalize();

        const camDir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion); camDir.y = 0; camDir.normalize();
        const camRight = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion); camRight.y = 0; camRight.normalize();

        const moveVec = new THREE.Vector3();
        moveVec.addScaledVector(camDir, moveDir.z);
        moveVec.addScaledVector(camRight, moveDir.x);

        let nextX = camera.position.x + moveVec.x * currentSpeed * dt;
        if(!checkCollisions(new THREE.Vector3(nextX, camera.position.y, camera.position.z))) {
            camera.position.x = nextX;
        }

        let nextZ = camera.position.z + moveVec.z * currentSpeed * dt;
        if(!checkCollisions(new THREE.Vector3(camera.position.x, camera.position.y, nextZ))) {
            camera.position.z = nextZ;
        }
    }

    // 3. Stalker AI Logic (Slow, Blind Patrols)
    for (let s of stalkers) {
        s.groanTimer -= dt;
        if (s.groanTimer <= 0) {
            s.groanTimer = 6 + Math.random() * 6;
            if (camera.position.distanceTo(s.mesh.position) < 30) {
                playStalkerGroan();
            }
        }

        let distToPlayer = s.mesh.position.distanceTo(camera.position);

        // Stalkers are BLIND: only detect player if VERY CLOSE (within 3.5 units)
        if (distToPlayer < 3.5) {
            let chaseDir = new THREE.Vector3().subVectors(camera.position, s.mesh.position).normalize();
            s.mesh.position.addScaledVector(chaseDir, s.speed * dt);
            s.mesh.lookAt(camera.position.x, s.mesh.position.y, camera.position.z);

            if (distToPlayer < 1.2) {
                // Caught by Stalker -> Game Over
                isGameOver = true;
                document.exitPointerLock();
                ui.screenTitle.innerText = "DIGESTED.\n\nTHE IMMUNE SYSTEM CONSUMED YOU.";
                ui.actionBtn.innerText = "Try Again";
                ui.actionBtn.onclick = () => { window.location.reload(); };
                ui.screenOverlay.style.display = 'flex';
            }
        } else {
            // Patrol towards random target
            let patrolDir = new THREE.Vector3().subVectors(s.patrolTarget, s.mesh.position);
            patrolDir.y = 0;
            if (patrolDir.length() < 1.5) {
                s.patrolTarget.set(s.mesh.position.x + (Math.random()-0.5)*40, 0, s.mesh.position.z + (Math.random()-0.5)*40);
            } else {
                patrolDir.normalize();
                s.mesh.position.addScaledVector(patrolDir, (s.speed * 0.5) * dt);
                s.mesh.lookAt(s.patrolTarget.x, s.mesh.position.y, s.patrolTarget.z);
            }
        }
    }

    // 4. Guidance System & Arrow Target
    hintTimer += dt;
    let currentTarget = null;

    if (buttonsPressed < 3) {
        let unpressed = buttons.filter(b => !b.userData.pressed);
        if (unpressed.length > 0) currentTarget = unpressed[0];
    } else {
        currentTarget = gateGroup; // Point to exit gate when done
    }

    if (hintTimer > 15 && currentTarget) {
        ui.hint.innerText = buttonsPressed < 3 ? "Locate the remaining red sandstone buttons around the city." : "The Gate is open! Head North to escape!";
        ui.hint.style.opacity = 1;
    }

    if (hintTimer > 25 && currentTarget) {
        let tPos = new THREE.Vector3();
        currentTarget.getWorldPosition(tPos);
        guideArrow.position.set(tPos.x, tPos.y + 3.0 + Math.sin(now * 0.005) * 0.3, tPos.z);
        guideArrow.visible = true;
    } else {
        guideArrow.visible = false;
    }

    // 5. Exit Trigger (Passed Gate)
    if (buttonsPressed === 3 && camera.position.z < -132) {
        isVictorious = true;
        document.exitPointerLock();
        ui.screenTitle.innerText = "LEVEL 2 CLEARED\n\nYOU ESCAPED SMILER'S GULLET!";
        ui.actionBtn.innerText = "Proceed to Level 3";
        ui.actionBtn.onclick = () => { window.location.href = '/levelthree.html'; };
        ui.screenOverlay.style.display = 'flex';
    }

    // 6. Raycast Interaction Prompts
    activeInteractable = null;
    ui.prompt.style.display = 'none';

    if (document.pointerLockElement === document.body) {
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
        const intersects = raycaster.intersectObjects(interactables);

        if (intersects.length > 0 && intersects[0].distance < 4.5) {
            let obj = intersects[0].object;
            let type = obj.userData.type;
            let pText = "";

            if (type === 'door') pText = obj.userData.open ? "Z to Close Door" : "Z to Open Door";
            else if (type === 'diary') pText = "Z to Read Journal Entry";
            else if (type === 'button' && !obj.userData.pressed) pText = "Z to Press Sandstone Button";

            if (pText) {
                activeInteractable = obj;
                ui.prompt.innerText = pText;
                ui.prompt.style.display = 'block';
            }
        }
    }

    renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
