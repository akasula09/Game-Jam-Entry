<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 2: Inside Smiler</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #050201;
            font-family: 'Courier New', Courier, monospace; user-select: none;
        }
        #game-canvas { display: block; width: 100%; height: 100%; }
        .overlay { position: absolute; pointer-events: none; display: none; z-index: 50; }
        #crosshair { top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255, 180, 120, 0.7); font-size: 20px; display: block; }
        #interact-prompt { top: 55%; left: 50%; transform: translateX(-50%); color: #ffe0b2; font-size: 20px; text-shadow: 2px 2px 0px #000; }
        #flash-text { top: 20%; left: 50%; transform: translateX(-50%); color: #ffaa55; font-size: 28px; text-shadow: 3px 3px 0px #000; opacity: 0; transition: opacity 0.5s; text-align: center; display: block; }
        #hint-text { bottom: 10%; left: 50%; transform: translateX(-50%); color: #d1b894; font-size: 16px; background: rgba(15, 10, 5, 0.9); border: 1px solid #7a5c37; padding: 10px 20px; border-radius: 4px; opacity: 0; transition: opacity 1s; display: block; }
        #diary-view { top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 5, 2, 0.92); display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 60; pointer-events: auto; }
        #diary-view .paper { background: #d4b185; color: #2b1704; padding: 35px; border-radius: 3px; max-width: 500px; font-family: 'Georgia', serif; line-height: 1.6; border: 2px solid #8c5d2e; }
        #diary-view h3 { margin-top: 0; color: #591d0b; border-bottom: 1px dashed #7a461e; }
        #diary-view .sub { color: #bbb; margin-top: 15px; font-size: 14px; font-family: 'Courier New', Courier, monospace; }
        #status-hud { top: 20px; left: 20px; color: #e0aa6b; font-size: 18px; display: block; text-shadow: 1px 1px 2px #000; }
        #inventory-hud { top: 50px; left: 20px; color: #ffca85; font-size: 16px; display: block; text-shadow: 1px 1px 2px #000; }
        #screen-overlay { top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; pointer-events: auto; }
        #screen-overlay h1 { color: #ff4400; font-size: 2.5vw; text-shadow: 0 0 15px #ff1100; text-align: center; margin-bottom: 25px; white-space: pre-line; }
        #action-btn { padding: 15px 35px; font-size: 20px; font-family: 'Courier New', Courier, monospace; background: #1c0d02; color: #ffaa55; border: 2px solid #a85513; cursor: pointer; }
        #action-btn:hover { background: #883300; color: #fff; }
        .click-to-start { position: absolute; top:0; left:0; width:100%; height:100%; background: #0d0603; color: #e0aa6b; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; cursor: pointer; text-align: center; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body>

    <div id="start-screen" class="click-to-start">
        <h2>LEVEL 2: AWAKE IN THE DESERT CITY</h2>
        <p style="font-size: 16px; color: #a88158;">You are deep inside Smiler.<br>Find 4 sandstone buttons to raise the gate.</p>
        <span style="font-size: 18px; border: 1px solid #e0aa6b; padding: 10px 20px; margin-top: 20px;">Click to Begin</span>
    </div>

    <div id="crosshair" class="overlay">+</div>
    <div id="status-hud" class="overlay">Gate Buttons: <span id="button-count">0</span>/4</div>
    <div id="inventory-hud" class="overlay">Keys: <span id="key-status">None</span></div>
    <div id="interact-prompt" class="overlay"></div>
    <div id="flash-text" class="overlay"></div>
    <div id="hint-text" class="overlay"></div>

    <div id="diary-view" class="overlay">
        <div class="paper">
            <h3 id="diary-title">Journal</h3>
            <p id="diary-text">...</p>
        </div>
        <div class="sub">Press Z to close</div>
    </div>

    <div id="screen-overlay" class="overlay">
        <h1 id="screen-title">GAME OVER</h1>
        <button id="action-btn">Action</button>
    </div>

<script>
// --- AUDIO ENGINE ---
let audioInitialized = false;
let synthHeartbeat, synthAmbience, synthStalkerSound;

function initAudio() {
    if (audioInitialized) return;
    Tone.start();
    synthHeartbeat = new Tone.MembraneSynth().toDestination();
    synthHeartbeat.volume.value = -10;
    
    const filter = new Tone.Filter(200, "lowpass").toDestination();
    synthAmbience = new Tone.NoiseSynth({ noise: { type: "brown" }, envelope: { attack: 2, sustain: 1, release: 2 } }).connect(filter);
    synthAmbience.volume.value = -18;
    synthAmbience.triggerAttack();

    synthStalkerSound = new Tone.AMSynth().toDestination();
    synthStalkerSound.volume.value = -14;
    audioInitialized = true;
}

function playHeartbeat() {
    if (!audioInitialized) return;
    synthHeartbeat.triggerAttackRelease("C1", "8n");
    setTimeout(() => synthHeartbeat.triggerAttackRelease("A0", "8n"), 250);
}

function playStalkerGroan() {
    if (!audioInitialized) return;
    synthStalkerSound.triggerAttackRelease("E1", "0.4");
}

// --- GAME STATE ---
let buttonsPressed = 0;
let hasBrassKey = false;
let isReadingDiary = false;
let isGameOver = false;
let isVictorious = false;
let hintTimer = 0;

const ui = {
    start: document.getElementById('start-screen'),
    prompt: document.getElementById('interact-prompt'),
    flash: document.getElementById('flash-text'),
    hint: document.getElementById('hint-text'),
    diary: document.getElementById('diary-view'),
    diaryTitle: document.getElementById('diary-title'),
    diaryText: document.getElementById('diary-text'),
    btnCount: document.getElementById('button-count'),
    keyStatus: document.getElementById('key-status'),
    screenOverlay: document.getElementById('screen-overlay'),
    screenTitle: document.getElementById('screen-title'),
    actionBtn: document.getElementById('action-btn')
};

// --- THREE.JS SETUP ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x120a04);
scene.fog = new THREE.FogExp2(0x120a04, 0.022); // Dense fog for horror depth

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 150);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xff9955, 0.35);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xff6622, 0.5);
sunLight.position.set(30, 40, 20);
scene.add(sunLight);

// Arrow Guidance
const arrowGeo = new THREE.ConeGeometry(0.4, 1.2, 6);
arrowGeo.rotateX(Math.PI);
const guideArrow = new THREE.Mesh(arrowGeo, new THREE.MeshBasicMaterial({ color: 0xffa500, wireframe: true }));
guideArrow.visible = false;
scene.add(guideArrow);

// --- CONTROLS ---
let pitch = 0, yaw = 0;
const PI_2 = Math.PI / 2;
const keys = { w: false, a: false, s: false, d: false, z: false };
let baseSpeed = 7.0;
let currentSpeed = 7.0;
let playerPos = new THREE.Vector3(0, 1.7, 100);
camera.position.copy(playerPos);

document.addEventListener('mousemove', (e) => {
    if (document.pointerLockElement === document.body && !isGameOver && !isVictorious && !isReadingDiary) {
        yaw -= e.movementX * 0.002;
        pitch -= e.movementY * 0.002;
        pitch = Math.max(-PI_2 + 0.1, Math.min(PI_2 - 0.1, pitch));
        const qx = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), pitch);
        const qy = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        camera.quaternion.copy(qy).multiply(qx);
    }
});

document.addEventListener('keydown', (e) => {
    if(e.code === 'KeyW') keys.w = true;
    if(e.code === 'KeyA') keys.a = true;
    if(e.code === 'KeyS') keys.s = true;
    if(e.code === 'KeyD') keys.d = true;
    if(e.code === 'KeyZ') { if (!keys.z) handleZPress(); keys.z = true; }
});
document.addEventListener('keyup', (e) => {
    if(e.code === 'KeyW') keys.w = false;
    if(e.code === 'KeyA') keys.a = false;
    if(e.code === 'KeyS') keys.s = false;
    if(e.code === 'KeyD') keys.d = false;
    if(e.code === 'KeyZ') keys.z = false;
});

ui.start.addEventListener('click', () => {
    initAudio();
    ui.start.style.display = 'none';
    document.body.requestPointerLock();
    document.getElementById('crosshair').style.display = 'block';
    document.getElementById('status-hud').style.display = 'block';
    document.getElementById('inventory-hud').style.display = 'block';
    flashText("Find 4 Sandstone Buttons to raise the Gate.");
});

document.body.addEventListener('click', () => {
    if (ui.start.style.display === 'none' && !isGameOver && !isVictorious && !isReadingDiary) {
        document.body.requestPointerLock();
    }
});

// --- WORLD BUILDER ---
const interactables = [];
const solidWalls = [];
const acidPools = [];
const buttons = [];
const stalkers = [];

function addCollider(x, z, w, d, ref = null) {
    let col = { minX: x - w/2, maxX: x + w/2, minZ: z - d/2, maxZ: z + d/2, ref: ref };
    solidWalls.push(col);
    return col;
}

function removeCollider(ref) {
    const idx = solidWalls.findIndex(c => c.ref === ref);
    if (idx > -1) solidWalls.splice(idx, 1);
}

// Ground & Sandstone Materials
const ground = new THREE.Mesh(new THREE.PlaneGeometry(240, 280), new THREE.MeshLambertMaterial({ color: 0xaa7038 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);

const matSandstone = new THREE.MeshLambertMaterial({ color: 0x8c592b });
const matDarkSandstone = new THREE.MeshLambertMaterial({ color: 0x5e3a1a });
const matBone = new THREE.MeshLambertMaterial({ color: 0xc4b491 });
const matCloth = new THREE.MeshLambertMaterial({ color: 0xa84125 });

// Sidewalk Grid System
function createSidewalk(x, z, w, d) {
    const sw = new THREE.Mesh(new THREE.BoxGeometry(w, 0.15, d), matDarkSandstone);
    sw.position.set(x, 0.075, z); scene.add(sw);
}

// Outer Perimeter
function createBoundary() {
    const h = 12;
    let n = new THREE.Mesh(new THREE.BoxGeometry(240, h, 4), matSandstone); n.position.set(0, h/2, -140); scene.add(n); addCollider(0, -140, 240, 4);
    let s = new THREE.Mesh(new THREE.BoxGeometry(240, h, 4), matSandstone); s.position.set(0, h/2, 140); scene.add(s); addCollider(0, 140, 240, 4);
    let e = new THREE.Mesh(new THREE.BoxGeometry(4, h, 280), matSandstone); e.position.set(120, h/2, 0); scene.add(e); addCollider(120, 0, 4, 280);
    let w = new THREE.Mesh(new THREE.BoxGeometry(4, h, 280), matSandstone); w.position.set(-120, h/2, 0); scene.add(w); addCollider(-120, 0, 4, 280);
}
createBoundary();

// --- BUILDING BUILDER ENGINE ---
function buildBuilding(x, z, width, depth, stories, isLocked = false, lockKeyId = null, diaryData = null, propType = null) {
    const wallT = 0.6;
    const storyH = 4.2;
    const totalH = storyH * stories;

    // Outer Walls
    let back = new THREE.Mesh(new THREE.BoxGeometry(width, totalH, wallT), matSandstone); back.position.set(x, totalH/2, z - depth/2); scene.add(back); addCollider(x, z - depth/2, width, wallT);
    let left = new THREE.Mesh(new THREE.BoxGeometry(wallT, totalH, depth), matSandstone); left.position.set(x - width/2, totalH/2, z); scene.add(left); addCollider(x - width/2, z, wallT, depth);
    let right = new THREE.Mesh(new THREE.BoxGeometry(wallT, totalH, depth), matSandstone); right.position.set(x + width/2, totalH/2, z); scene.add(right); addCollider(x + width/2, z, wallT, depth);

    // Front Wall with Doorway
    let frontLeft = new THREE.Mesh(new THREE.BoxGeometry((width - 3)/2, totalH, wallT), matSandstone); frontLeft.position.set(x - (width/4 + 0.75), totalH/2, z + depth/2); scene.add(frontLeft); addCollider(x - (width/4 + 0.75), z + depth/2, (width - 3)/2, wallT);
    let frontRight = new THREE.Mesh(new THREE.BoxGeometry((width - 3)/2, totalH, wallT), matSandstone); frontRight.position.set(x + (width/4 + 0.75), totalH/2, z + depth/2); scene.add(frontRight); addCollider(x + (width/4 + 0.75), z + depth/2, (width - 3)/2, wallT);
    let lintel = new THREE.Mesh(new THREE.BoxGeometry(3, totalH - 3.5, wallT), matSandstone); lintel.position.set(x, 3.5 + (totalH - 3.5)/2, z + depth/2); scene.add(lintel);

    // Floors & Roof
    for(let i=1; i<=stories; i++) {
        let fl = new THREE.Mesh(new THREE.BoxGeometry(width + 0.2, 0.3, depth + 0.2), matDarkSandstone);
        fl.position.set(x, i * storyH, z); scene.add(fl);
    }

    // Door with Collision Ref
    const doorPivot = new THREE.Group(); doorPivot.position.set(x - 1.5, 0, z + depth/2);
    const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(3, 3.5, 0.2), new THREE.MeshLambertMaterial({ color: isLocked ? 0x221105 : 0x5c3a1e }));
    doorMesh.position.set(1.5, 1.75, 0); doorPivot.add(doorMesh); scene.add(doorPivot);

    const doorCol = addCollider(x, z + depth/2, 3, 0.5, doorMesh);

    doorMesh.userData = { 
        type: 'door', pivot: doorPivot, open: false, moving: false, 
        locked: isLocked, keyId: lockKeyId, collider: doorCol, pos: {x: x, z: z + depth/2}
    };
    interactables.push(doorMesh);

    // Staircase for Multi-story
    if (stories > 1) {
        for(let st=0; st<stories-1; st++) {
            for(let i=0; i<8; i++) {
                let step = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.5, 0.5), matDarkSandstone);
                step.position.set(x + width/2 - 1.2, 0.25 + st*storyH + i*0.5, (z - depth/2 + 1.2) + i*0.5); scene.add(step);
            }
        }
    }

    // Interior Unique Props
    if (propType === 'table') {
        let tbl = new THREE.Mesh(new THREE.BoxGeometry(2, 0.8, 1.2), matDarkSandstone); tbl.position.set(x - 1.5, 0.4, z - 1); scene.add(tbl); addCollider(x - 1.5, z - 1, 2, 1.2);
    } else if (propType === 'rubble') {
        let rub = new THREE.Mesh(new THREE.DodecahedronGeometry(1.0), matSandstone); rub.position.set(x + 1, 0.5, z - 1); scene.add(rub); addCollider(x + 1, z - 1, 1.5, 1.5);
    }

    // Optional Diary
    if (diaryData) {
        let diaryMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.7), new THREE.MeshBasicMaterial({ color: 0xffeedd }));
        diaryMesh.rotation.x = -Math.PI / 2;
        diaryMesh.position.set(x, (stories - 1) * storyH + 0.2, z);
        diaryMesh.userData = { type: 'diary', title: diaryData.title, text: diaryData.text };
        scene.add(diaryMesh); interactables.push(diaryMesh);
    }

    createSidewalk(x, z + depth/2 + 2, width + 4, 3);
    return { x, z, stories, topY: (stories - 1) * storyH };
}

// Tents / Campsites
function buildTent(x, z, hasKey = false) {
    const tentMat = new THREE.MeshLambertMaterial({ color: 0x73301a, side: THREE.DoubleSide });
    const tentGeo = new THREE.ConeGeometry(3, 3, 4);
    const tent = new THREE.Mesh(tentGeo, tentMat);
    tent.position.set(x, 1.5, z); scene.add(tent); addCollider(x, z, 3, 3);

    if (hasKey) {
        const keyMesh = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.05, 8, 16), new THREE.MeshBasicMaterial({ color: 0xffd700 }));
        keyMesh.position.set(x + 1.8, 0.2, z + 1.8); keyMesh.rotation.x = Math.PI / 2; scene.add(keyMesh);
        keyMesh.userData = { type: 'key', keyId: 'brass_key' };
        interactables.push(keyMesh);
    }
}

// --- CITY MAP GENERATION ---

// 1. CITY CENTER PLAZA
const centerObelisk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 1.5, 12, 4), matDarkSandstone);
centerObelisk.position.set(0, 6, 0); scene.add(centerObelisk); addCollider(0, 0, 3, 3);
createSidewalk(0, 0, 35, 35);

// 2. DENSE BUILDINGS GRID
// North-West District
let b1 = buildBuilding(-45, 50, 10, 10, 3, false, null, { title: "Tower Note", text: "I climbed to the top... the view of this organism is horrific. A button rests on the top floor." }, 'rubble');
let b2 = buildBuilding(-20, 60, 12, 10, 2, false, null, null, 'table');
buildBuilding(-55, 20, 12, 12, 1, false, null, null, null);

// North-East District (LOCKED HOUSE WITH BUTTON)
let bLockedBtn = buildBuilding(45, 55, 12, 12, 2, true, 'brass_key', null, 'table');

// South-West District (LOCKED DECOY HOUSE - RAGEBAIT)
let bLockedRage = buildBuilding(-50, -50, 10, 10, 1, true, 'brass_key', { title: "Fool's Note", text: "You unlocked this door hoping for salvation? There is no button here. Only regret." }, null);

// South-East District
buildBuilding(40, -40, 14, 10, 2, false, null, null, 'rubble');
buildBuilding(55, -80, 10, 10, 1, false, null, null, 'table');

// Tents
buildTent(-25, -20, true); // Contains Brass Key
buildTent(30, 25, false);
buildTent(-10, -70, false);

// Acid Pools
function createAcidPool(x, z, r) {
    let pool = new THREE.Mesh(new THREE.CircleGeometry(r, 16), new THREE.MeshBasicMaterial({ color: 0x33ff33, transparent: true, opacity: 0.7 }));
    pool.rotation.x = -Math.PI / 2; pool.position.set(x, 0.02, z); scene.add(pool);
    acidPools.push({ x, z, radius: r });
}
createAcidPool(-15, 20, 3.5);
createAcidPool(25, -60, 4.0);

// Calcified Gate
const gateGroup = new THREE.Group(); gateGroup.position.set(0, 0, -135);
for(let i = -5; i <= 5; i++) {
    let rib = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 10), matBone);
    rib.position.set(i * 1.2, 5, 0); gateGroup.add(rib);
}
scene.add(gateGroup); addCollider(0, -135, 14, 2);

// --- 4 HIDDEN BUTTONS ---
function createButton(x, y, z, id) {
    let base = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 1.2), matSandstone); base.position.set(x, y, z); scene.add(base);
    let btn = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.3, 0.6), new THREE.MeshLambertMaterial({ color: 0xff2200 }));
    btn.position.set(x, y + 0.4, z); scene.add(btn);
    btn.userData = { type: 'button', id: id, pressed: false };
    interactables.push(btn); buttons.push(btn);
}

createButton(-45, b1.topY + 0.4, 50, 1); // Button 1: NW 3-Story Tower Top Floor
createButton(0, 0.4, -5, 2);              // Button 2: City Center Plaza (DANGEROUS)
createButton(45, 0.4, 55, 3);             // Button 3: Inside Locked House (Needs Key)
createButton(-75, 0.4, -20, 4);           // Button 4: Hidden in Outer Alleyway

// --- STALKER AI (More in City Center) ---
function createStalker(x, z) {
    const grp = new THREE.Group();
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0x331d0f });
    const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.4, 2.8), bodyMat); torso.position.y = 1.4; grp.add(torso);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.5, 10, 10), bodyMat); head.position.y = 3.0; grp.add(head);
    grp.position.set(x, 0, z); scene.add(grp);

    stalkers.push({
        mesh: grp, speed: 3.5,
        patrolTarget: new THREE.Vector3(x + (Math.random()-0.5)*25, 0, z + (Math.random()-0.5)*25),
        groanTimer: Math.random() * 5
    });
}

createStalker(5, 5);    // City Center Guard 1
createStalker(-5, -5);  // City Center Guard 2
createStalker(-40, 30); // NW District
createStalker(40, -30); // SE District

// --- INTERACTION HANDLING ---
let activeInteractable = null;

function handleZPress() {
    if (isReadingDiary) {
        ui.diary.style.display = 'none'; isReadingDiary = false; document.body.requestPointerLock(); return;
    }

    if (activeInteractable) {
        let type = activeInteractable.userData.type;

        if (type === 'key') {
            hasBrassKey = true;
            ui.keyStatus.innerText = "Brass Key";
            flashText("Picked up the Brass Key!");
            scene.remove(activeInteractable);
            interactables.splice(interactables.indexOf(activeInteractable), 1);
        }
        else if (type === 'door') {
            let data = activeInteractable.userData;
            if (data.moving) return;

            if (data.locked) {
                if (hasBrassKey) {
                    data.locked = false;
                    flashText("Unlocked the door with the Brass Key!");
                } else {
                    flashText("The door is locked tight. Needs a key.");
                    return;
                }
            }

            data.moving = true;
            let targetAngle = data.open ? 0 : Math.PI / 2;
            let step = data.open ? -0.05 : 0.05;

            // Remove collision while opening
            removeCollider(data.collider.ref);

            let anim = setInterval(() => {
                data.pivot.rotation.y += step;
                if ((step > 0 && data.pivot.rotation.y >= targetAngle) || (step < 0 && data.pivot.rotation.y <= targetAngle)) {
                    data.pivot.rotation.y = targetAngle;
                    data.open = !data.open;
                    data.moving = false;
                    clearInterval(anim);

                    // Re-add collider if door is closed again
                    if (!data.open) {
                        data.collider = addCollider(data.pos.x, data.pos.z, 3, 0.5, activeInteractable);
                    }
                }
            }, 16);
        }
        else if (type === 'diary') {
            ui.diaryTitle.innerText = activeInteractable.userData.title;
            ui.diaryText.innerText = activeInteractable.userData.text;
            ui.diary.style.display = 'flex'; isReadingDiary = true; document.exitPointerLock();
        }
        else if (type === 'button' && !activeInteractable.userData.pressed) {
            activeInteractable.userData.pressed = true;
            activeInteractable.position.y -= 0.15;
            activeInteractable.material.color.setHex(0x00ff00);
            buttonsPressed++;
            ui.btnCount.innerText = buttonsPressed;
            playHeartbeat();
            flashText(`Gate Mechanism Activated (${buttonsPressed}/4)`);
            gateGroup.position.y += 2.0;

            if (buttonsPressed === 4) {
                flashText("THE GATE IS FULLY OPENED! ESCAPE NORTH!");
                solidWalls.splice(solidWalls.findIndex(w => w.minZ === -135), 1);
            }
        }
    }
}

function flashText(msg) {
    ui.flash.innerText = msg; ui.flash.style.opacity = 1;
    setTimeout(() => { ui.flash.style.opacity = 0; }, 3000);
}

// Collision Checker
function checkCollisions(newPos) {
    let r = 0.5;
    for(let w of solidWalls) {
        if (newPos.x + r > w.minX && newPos.x - r < w.maxX &&
            newPos.z + r > w.minZ && newPos.z - r < w.maxZ) {
            return true;
        }
    }
    return false;
}

// --- MAIN LOOP ---
let lastTime = performance.now();

function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    if (isGameOver || isVictorious) return;

    // Acid slowdown
    currentSpeed = baseSpeed;
    for (let pool of acidPools) {
        if (Math.hypot(camera.position.x - pool.x, camera.position.z - pool.z) < pool.radius) {
            currentSpeed = baseSpeed * 0.35; break;
        }
    }

    // Player Movement (W FORWARD, S BACKWARD FIXED)
    if (document.pointerLockElement === document.body && !isReadingDiary) {
        let dirX = Number(keys.d) - Number(keys.a);
        let dirZ = Number(keys.w) - Number(keys.s); // Corrected orientation
        
        const camDir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion); camDir.y = 0; camDir.normalize();
        const camRight = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion); camRight.y = 0; camRight.normalize();

        const moveVec = new THREE.Vector3();
        moveVec.addScaledVector(camDir, dirZ);
        moveVec.addScaledVector(camRight, dirX);
        moveVec.normalize();

        let nextX = camera.position.x + moveVec.x * currentSpeed * dt;
        if(!checkCollisions(new THREE.Vector3(nextX, camera.position.y, camera.position.z))) {
            camera.position.x = nextX;
        }

        let nextZ = camera.position.z + moveVec.z * currentSpeed * dt;
        if(!checkCollisions(new THREE.Vector3(camera.position.x, camera.position.y, nextZ))) {
            camera.position.z = nextZ;
        }
    }

    // Stalkers Logic
    for (let s of stalkers) {
        s.groanTimer -= dt;
        if (s.groanTimer <= 0) {
            s.groanTimer = 5 + Math.random() * 5;
            if (camera.position.distanceTo(s.mesh.position) < 25) playStalkerGroan();
        }

        let dist = s.mesh.position.distanceTo(camera.position);

        // Blind Stalkers: Chase if extremely close (< 3.8 units)
        if (dist < 3.8) {
            let chaseDir = new THREE.Vector3().subVectors(camera.position, s.mesh.position).normalize();
            s.mesh.position.addScaledVector(chaseDir, s.speed * dt);
            s.mesh.lookAt(camera.position.x, s.mesh.position.y, camera.position.z);

            if (dist < 1.2) {
                isGameOver = true; document.exitPointerLock();
                ui.screenTitle.innerText = "DIGESTED.\n\nAN IMMUNE CELL CONSUMED YOU.";
                ui.actionBtn.innerText = "Try Again";
                ui.actionBtn.onclick = () => window.location.reload();
                ui.screenOverlay.style.display = 'flex';
            }
        } else {
            // Patrol Target
            let patrolDir = new THREE.Vector3().subVectors(s.patrolTarget, s.mesh.position); patrolDir.y = 0;
            if (patrolDir.length() < 1.5) {
                s.patrolTarget.set(s.mesh.position.x + (Math.random()-0.5)*30, 0, s.mesh.position.z + (Math.random()-0.5)*30);
            } else {
                patrolDir.normalize();
                s.mesh.position.addScaledVector(patrolDir, (s.speed * 0.4) * dt);
                s.mesh.lookAt(s.patrolTarget.x, s.mesh.position.y, s.patrolTarget.z);
            }
        }
    }

    // Guidance Arrow System
    hintTimer += dt;
    let currentTarget = null;
    if (buttonsPressed < 4) {
        let unpressed = buttons.filter(b => !b.userData.pressed);
        if (unpressed.length > 0) currentTarget = unpressed[0];
    } else {
        currentTarget = gateGroup;
    }

    if (hintTimer > 15 && currentTarget) {
        ui.hint.innerText = buttonsPressed < 4 ? "Search inside towers, locked houses, and outer alleys for buttons." : "The Gate is open! Escape to the North!";
        ui.hint.style.opacity = 1;
    }

    if (hintTimer > 30 && currentTarget) {
        let tPos = new THREE.Vector3(); currentTarget.getWorldPosition(tPos);
        guideArrow.position.set(tPos.x, tPos.y + 2.5 + Math.sin(now * 0.005) * 0.3, tPos.z);
        guideArrow.visible = true;
    } else { guideArrow.visible = false; }

    // Exit Detection
    if (buttonsPressed === 4 && camera.position.z < -138) {
        isVictorious = true; document.exitPointerLock();
        ui.screenTitle.innerText = "LEVEL 2 CLEARED\n\nYOU ESCAPED SMILER'S GULLET!";
        ui.actionBtn.innerText = "Proceed to Level 3";
        ui.actionBtn.onclick = () => { window.location.href = '/levelthree.html'; };
        ui.screenOverlay.style.display = 'flex';
    }

    // Raycast Interaction Prompts
    activeInteractable = null;
    ui.prompt.style.display = 'none';

    if (document.pointerLockElement === document.body) {
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
        const intersects = raycaster.intersectObjects(interactables);

        if (intersects.length > 0 && intersects[0].distance < 4.5) {
            let obj = intersects[0].object;
            let type = obj.userData.type;
            let pText = "";

            if (type === 'key') pText = "Z to Pick Up Brass Key";
            else if (type === 'door') {
                if (obj.userData.locked) pText = hasBrassKey ? "Z to Unlock Door (Brass Key)" : "Door is Locked";
                else pText = obj.userData.open ? "Z to Close Door" : "Z to Open Door";
            }
            else if (type === 'diary') pText = "Z to Read Journal Entry";
            else if (type === 'button' && !obj.userData.pressed) pText = "Z to Press Sandstone Button";

            if (pText) {
                activeInteractable = obj;
                ui.prompt.innerText = pText;
                ui.prompt.style.display = 'block';
            }
        }
    }

    renderer.render(scene, camera);
}

animate();
</script>
