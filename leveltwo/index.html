<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stomach Level - Clear Paths & Reachable Objectives</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: monospace;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff3333;
            text-shadow: 2px 2px 4px #000;
            font-size: 18px;
            pointer-events: none;
        }

        .hud-panel {
            background: rgba(20, 0, 0, 0.7);
            border: 2px solid #880000;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid #000;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            text-align: center;
            background: rgba(0,0,0,0.85);
            padding: 30px;
            border: 3px solid #ff3333;
            border-radius: 10px;
            cursor: pointer;
        }

        #health-bar {
            width: 200px;
            height: 15px;
            background: #440000;
            border: 1px solid #ff3333;
            margin-top: 5px;
        }

        #health-fill {
            width: 100%;
            height: 100%;
            background: #ff3333;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="crosshair"></div>

    <div id="ui-layer">
        <div class="hud-panel">
            <div>STOMACH ACID EXPOSURE</div>
            <div id="health-bar"><div id="health-fill"></div></div>
            <br>
            <div>HORMONE RELEASERS: <span id="button-count">0 / 4</span></div>
            <div id="key-status">BRASS KEY: NOT FOUND</div>
            <div id="prompt" style="color: #ffff00; margin-top: 10px;"></div>
        </div>
    </div>

    <div id="instructions">
        <h2>STOMACH CAVITY - LEVEL 2</h2>
        <p>Click anywhere to start</p>
        <p><strong>WASD</strong> - Move (Full air-control enabled!)</p>
        <p><strong>SPACE</strong> - Jump</p>
        <p><strong>E</strong> - Interact / Press Buttons</p>
        <p style="color: #ffaaaa;">Follow the BROWN PATH to stay safe and reach all 4 Hormone Releasers.</p>
    </div>

    <!-- Include Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- SCENE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x2b0505, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffaaaa, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xff6666, 0.8);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // --- PLAYER & PHYSICS STATE ---
        const player = {
            position: new THREE.Vector3(0, 1.6, -100),
            velocity: new THREE.Vector3(),
            height: 1.6,
            health: 100,
            hasKey: false,
            buttonsPressed: 0
        };

        let velocityY = 0;
        let isGrounded = true;
        const gravity = 18.0;      // Gentle gravity for predictable jumps
        const jumpStrength = 13.5;  // High jump strength to comfortably scale stairs
        const moveSpeed = 12.0;

        // --- CONTROLS SYSTEM ---
        const keys = {};
        let isLocked = false;

        const instructions = document.getElementById('instructions');
        instructions.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === document.body) {
                isLocked = true;
                instructions.style.display = 'none';
            } else {
                isLocked = false;
                instructions.style.display = 'block';
            }
        });

        document.addEventListener('keydown', (e) => keys[e.code] = true);
        document.addEventListener('keyup', (e) => keys[e.code] = false);

        let pitch = 0;
        let yaw = 0;
        document.addEventListener('mousemove', (e) => {
            if (!isLocked) return;
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
        });

        // --- WORLD MATERIALS ---
        const acidMaterial = new THREE.MeshLambertMaterial({ color: 0x33aa33, transparent: true, opacity: 0.8 });
        const brownPathMaterial = new THREE.MeshLambertMaterial({ color: 0x5c4033 });
        const wallMaterial = new THREE.MeshLambertMaterial({ color: 0x4a0e0e });
        const buttonOffMaterial = new THREE.MeshLambertMaterial({ color: 0xff0000 });
        const buttonOnMaterial = new THREE.MeshLambertMaterial({ color: 0x00ff00 });

        // --- ENVIRONMENT GENERATION ---
        
        // 1. Acid Sea (Floor)
        const acidSea = new THREE.Mesh(
            new THREE.PlaneGeometry(300, 300),
            acidMaterial
        );
        acidSea.rotation.x = -Math.PI / 2;
        acidSea.position.y = 0;
        scene.add(acidSea);

        // Track path bounds for safe ground checks
        const safeZones = [];

        function createBrownPathSegment(x, z, width, depth) {
            const path = new THREE.Mesh(
                new THREE.BoxGeometry(width, 0.4, depth),
                brownPathMaterial
            );
            path.position.set(x, 0.2, z);
            scene.add(path);

            safeZones.push({
                minX: x - width / 2,
                maxX: x + width / 2,
                minZ: z - depth / 2,
                maxZ: z + depth / 2
            });
        }

        // --- 2. CONNECTED SAFE BROWN PATH NETWORK ---
        // Main Central Spine (From Spawn at Z=-100 to North Exit at Z=50)
        createBrownPathSegment(0, -25, 12, 160);
        
        // East Branch to Button 3
        createBrownPathSegment(30, -25, 50, 10);
        
        // West Branch to Button 4
        createBrownPathSegment(-30, -25, 50, 10);

        // Tower Ramp / Pathway to Button 1 (North-West)
        createBrownPathSegment(-30, 25, 12, 60);

        // --- 3. STAIRCASE & ELEVATED PLATFORMS ---
        const stairSteps = [];
        function createStaircase(startX, startY, startZ, count) {
            for (let i = 0; i < count; i++) {
                const step = new THREE.Mesh(
                    new THREE.BoxGeometry(8, 0.6, 2),
                    brownPathMaterial
                );
                const stepX = startX;
                const stepY = startY + (i * 0.5);
                const stepZ = startZ + (i * 1.8);
                step.position.set(stepX, stepY, stepZ);
                scene.add(step);

                stairSteps.push({
                    box: new THREE.Box3().setFromObject(step),
                    topY: stepY + 0.3
                });

                // Add step base to safe zones so standing on stairs doesn't damage player
                safeZones.push({
                    minX: stepX - 4,
                    maxX: stepX + 4,
                    minZ: stepZ - 0.9,
                    maxZ: stepZ + 0.9
                });
            }
        }

        // Staircase leading up to Button 1 Tower
        createStaircase(-30, 0.3, 10, 12);

        // Tower Top Platform
        const towerTop = new THREE.Mesh(
            new THREE.BoxGeometry(10, 0.5, 10),
            brownPathMaterial
        );
        towerTop.position.set(-30, 6.3, 33);
        scene.add(towerTop);
        safeZones.push({ minX: -35, maxX: -25, minZ: 28, maxZ: 38 });

        // --- 4. HORMONE RELEASER BUTTONS ---
        const buttons = [];

        function createHormoneButton(x, y, z, id) {
            const pedestal = new THREE.Mesh(
                new THREE.CylinderGeometry(0.8, 1, 1.2, 8),
                wallMaterial
            );
            pedestal.position.set(x, y + 0.6, z);
            scene.add(pedestal);

            const btnCap = new THREE.Mesh(
                new THREE.CylinderGeometry(0.5, 0.5, 0.3, 8),
                buttonOffMaterial
            );
            btnCap.position.set(x, y + 1.3, z);
            scene.add(btnCap);

            buttons.push({
                id: id,
                position: new THREE.Vector3(x, y + 1.3, z),
                mesh: btnCap,
                pressed: false
            });
        }

        // Button 1: At the top of the Staircase Tower
        createHormoneButton(-30, 6.3, 33, 1);

        // Button 2: Directly on the main brown path (near middle)
        createHormoneButton(0, 0.4, -60, 2);

        // Button 3: At the end of the East Brown Branch
        createHormoneButton(50, 0.4, -25, 3);

        // Button 4: At the end of the West Brown Branch
        createHormoneButton(-50, 0.4, -25, 4);

        // --- INTERACTION & PROMPT ---
        const promptEl = document.getElementById('prompt');
        const buttonCountEl = document.getElementById('button-count');

        function checkInteractions() {
            let nearButton = null;

            for (let btn of buttons) {
                const dist = player.position.distanceTo(btn.position);
                if (dist < 3.0 && !btn.pressed) {
                    nearButton = btn;
                    break;
                }
            }

            if (nearButton) {
                promptEl.innerText = "Press 'E' to Release Hormone";
                if (keys['KeyE']) {
                    nearButton.pressed = true;
                    nearButton.mesh.material = buttonOnMaterial;
                    player.buttonsPressed++;
                    buttonCountEl.innerText = `${player.buttonsPressed} / 4`;
                    promptEl.innerText = "Hormone Released!";
                }
            } else {
                promptEl.innerText = "";
            }
        }

        // --- MAIN GAME LOOP & MOVEMENT ENGINE ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);

            if (isLocked) {
                // --- CAMERA ROTATION ---
                camera.rotation.order = 'YXZ';
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;

                // --- HORIZONTAL MOVEMENT WITH AIR CONTROL ---
                const moveVector = new THREE.Vector3();
                if (keys['KeyW']) moveVector.z -= 1;
                if (keys['KeyS']) moveVector.z += 1;
                if (keys['KeyA']) moveVector.x -= 1;
                if (keys['KeyD']) moveVector.x += 1;

                moveVector.normalize();
                
                // Apply rotation relative to camera look direction
                const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

                const finalVelocity = new THREE.Vector3()
                    .addScaledVector(forward, -moveVector.z * moveSpeed)
                    .addScaledVector(side, moveVector.x * moveSpeed);

                player.position.x += finalVelocity.x * delta;
                player.position.z += finalVelocity.z * delta;

                // --- STAIRS & ELEVATION COLLISION ---
                let floorHeight = 0.0; // Default floor (acid surface)

                // Check Stair Collisions
                for (let stair of stairSteps) {
                    if (player.position.x >= stair.box.min.x && player.position.x <= stair.box.max.x &&
                        player.position.z >= stair.box.min.z && player.position.z <= stair.box.max.z) {
                        if (player.position.y >= stair.topY - 0.5) {
                            floorHeight = Math.max(floorHeight, stair.topY);
                        }
                    }
                }

                // Check Top Platform
                if (player.position.x >= -35 && player.position.x <= -25 &&
                    player.position.z >= 28 && player.position.z <= 38) {
                    floorHeight = Math.max(floorHeight, 6.8);
                }

                // --- JUMPING & VERTICAL PHYSICS ---
                if (keys['Space'] && isGrounded) {
                    velocityY = jumpStrength;
                    isGrounded = false;
                }

                // Apply Gravity
                velocityY -= gravity * delta;
                player.position.y += velocityY * delta;

                // Ground Landing Check
                const targetGround = floorHeight + player.height;
                if (player.position.y <= targetGround) {
                    player.position.y = targetGround;
                    velocityY = 0;
                    isGrounded = true;
                }

                // --- ACID DAMAGE CHECK ---
                let onSafeZone = false;
                for (let zone of safeZones) {
                    if (player.position.x >= zone.minX && player.position.x <= zone.maxX &&
                        player.position.z >= zone.minZ && player.position.z <= zone.maxZ) {
                        onSafeZone = true;
                        break;
                    }
                }

                // If stepping in acid and not airborne high above it
                if (!onSafeZone && player.position.y <= player.height + 0.2) {
                    player.health -= 15 * delta;
                    document.getElementById('health-fill').style.width = `${Math.max(0, player.health)}%`;
                    if (player.health <= 0) {
                        // Respawn at origin
                        player.health = 100;
                        player.position.set(0, 1.6, -100);
                        document.getElementById('health-fill').style.width = '100%';
                    }
                }

                // Sync camera with player body
                camera.position.copy(player.position);

                // Check for interactions
                checkInteractions();
            }

            renderer.render(scene, camera);
        }

        // --- RESIZE HANDLER ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
